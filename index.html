<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAGUARARA IMPORTS - Conectando o Brasil ao Mundo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#EAE8E1;border-radius:10px}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.truncate-2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body class="bg-[#FAF9F6] text-[#111] antialiased">
<div id="app"></div>

<script>
const SENHA = "sazgir-gaxxoh-0mIdno";
const STORAGE_KEY = "jaguarara_orders_v6";
const STATUS_LIST = [
  {id:"COMPRADO", label:"COMPRADO", desc:"Pedido criado no sistema"},
  {id:"CHEGOU_GALPAO", label:"CHEGOU NO GALPÃO", sub:"SHENZHEN, GUANGDONG", desc:"Chegou no galpão Shenzhen - Guangdong, China"},
  {id:"INSPECAO_QC", label:"INSPEÇÃO QC", desc:"Fotos reais sendo tiradas no galpão"},
  {id:"ENVIADO_BRASIL", label:"ENVIADO AO BRASIL", desc:"Saiu da China rumo ao Brasil"},
  {id:"ENTREGUE", label:"ENTREGUE", desc:"Entregue ao cliente"}
];

let orders = [];
let editingId = null;
let search = "";

function load(){ try{ orders = JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); }catch(e){ orders=[] } }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(orders)); }

function genId(){ return "JG-"+Math.floor(100000+Math.random()*899999); }
function nowDate(){ return new Date().toLocaleDateString('pt-BR'); }
function nowHour(){ return new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}); }

function isClientView(){ return new URLSearchParams(location.search).get('track'); }
function getTrackId(){ return new URLSearchParams(location.search).get('track'); }

function toast(msg){
  const t=document.createElement('div');
  t.className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#111] text-white px-5 py-3 rounded-full text- font-medium shadow-2xl z-[999]"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2500);
}

function loginView(){
  document.getElementById('app').innerHTML=`
  <div class="min-h-screen flex items-center justify-center p-6 bg-[#0E0E0E]">
    <div class="w-full max-w- bg-white rounded- p-10 shadow-[0_20px_80px_rgba(0,0,0,0.2)] border border-[#EAE8E1]">
      <div class="flex items-center gap-3 mb-8"><div class="w-10 h-10 rounded-full bg-[#111] flex items-center justify-center">🐆</div><div><div class="font-black tracking-tight">JAGUARARA IMPORTS</div><div class="text- tracking-[0.2em] text-[#8A8A86]">ADMIN • GALPÃO SHENZHEN</div></div></div>
      <h1 class="text- font-[800] leading-[1.1] mb-2">Bem-vindo ao<br>galpão.</h1>
      <p class="text- text-[#8A8A86] mb-8">Acesso restrito - Shenzhen, Guangdong, China</p>
      <input id="pass" type="password" placeholder="Senha de acesso" class="w-full h- px-5 rounded-full border border-[#EAE8E1] bg-[#FAF9F6] text- outline-none focus:border-[#111]">
      <button onclick="tryLogin()" class="mt-4 w-full h- rounded-full bg-[#111] text-white font-semibold text- hover:scale-[0.98] active:scale-[0.97] transition">Entrar no Galpão</button>
      <div class="mt-6 text- tracking-[0.15em] text-[#8A8A86] text-center">JAGUARARA IMPORTS • CONECTANDO O BRASIL AO MUNDO • SHENZHEN</div>
    </div>
  </div>`;
}
function tryLogin(){
  const v=document.getElementById('pass').value;
  if(v===SENHA){ localStorage.setItem('jg_auth','1'); renderAdmin(); }
  else{ const el=document.getElementById('pass'); el.classList.add('border-red-500'); el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300}); toast("Senha incorreta"); }
}

function renderAdmin(){
  const filtered = orders.filter(o=> (o.id+o.cliente+o.produto).toLowerCase().includes(search.toLowerCase()));
  const total = orders.length;
  const fatur = orders.reduce((s,o)=>s+(parseFloat(o.valor)||0),0);
  const noGalpao = orders.filter(o=>["COMPRADO","CHEGOU_GALPAO","INSPECAO_QC"].includes(o.status)).length;
  const enviados = orders.filter(o=>o.status==="ENVIADO_BRASIL").length;

  document.getElementById('app').innerHTML=`
  <div class="min-h-screen">
    <header class="h- bg-[#0E0E0E] text-white flex items-center justify-between px-6 sticky top-0 z-20 border-b border-[#1E1E1E]">
      <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center">🐆</div><div><div class="font-black text- tracking-tight">JAGUARARA IMPORTS</div><div class="text- tracking-[0.2em] text-[#8A8A86]">ADMIN • GALPÃO SHENZHEN, GUANGDONG</div></div></div>
      <div class="flex gap-3"><button onclick="openNew()" class="h-10 px-5 rounded-full bg-white text-black text- font-semibold">+ Novo Pedido</button><button onclick="logout()" class="h-10 px-4 rounded-full border border-[#2A2A2A] text-">Sair</button></div>
    </header>

    <div class="max-w- mx-auto p-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        ${statCard("TOTAL PEDIDOS", total, "ativos")}
        ${statCard("FATURAMENTO", "R$ "+fatur.toLocaleString('pt-BR',{minimumFractionDigits:2}), "estimado")}
        ${statCard("NO GALPÃO", noGalpao, "QC pendente • Shenzhen")}
        ${statCard("ENVIADOS", enviados, "em trânsito")}
      </div>

      <div class="mb-6"><input oninput="search=this.value; renderAdmin()" value="${search}" placeholder="Buscar JG-, cliente, produto" class="w-full h-12 px-6 rounded-full bg-white border border-[#EAE8E1] text- outline-none"></div>

      <div class="bg-white rounded- border border-[#EAE8E1] overflow-hidden">
        <div class="px-6 py-4 border-b border-[#EAE8E1] flex justify-between items-center"><div class="font-bold text- tracking-[0.14em]">PEDIDOS • GALPÃO SHENZHEN</div><div class="text- text-[#8A8A86]">${filtered.length} pedidos</div></div>
        ${filtered.length===0?`<div class="p-20 text-center"><div class="text- font-medium">Nenhum pedido ainda.</div><div class="text- text-[#8A8A86] mt-2">Clique em + Novo Pedido</div></div>`:
        filtered.map(o=>`
        <div class="px-6 py-5 flex gap-4 items-center border-b border-[#F2F0EB] hover:bg-[#FAF9F6] transition cursor-pointer">
          <div class="w- h- rounded- bg-[#FAF9F6] border border-[#EAE8E1] overflow-hidden flex-shrink-0 flex items-center justify-center">
            ${o.capa?`<img src="${o.capa}" class="w-full h-full object-cover">`:`📦`}
          </div>
          <div class="flex-1 min-w-0" onclick="openEdit('${o.id}')">
            <div class="flex gap-2 items-center mb-1"><span class="px-2.5 py-1 rounded-full bg-[#111] text-white text- font-bold tracking-widest">${o.id}</span><span class="px-2.5 py-1 rounded-full bg-[#FAF9F6] border border-[#EAE8E1] text- font-semibold">${getStatusLabel(o.status)}</span></div>
            <div class="font-semibold text- leading-tight line-clamp-2 break-words">${o.produto||"Sem nome"}</div>
            <div class="text- text-[#8A8A86] truncate">${o.cliente} • ${o.peso||""}${o.pesoUn||"kg"}</div>
          </div>
          <div class="text-right hidden md:block"><div class="font-bold text-">R$ ${o.valor||0}</div></div>
          <div class="flex gap-2"><button onclick="copyLink('${o.id}')" class="h-9 px-4 rounded-full border border-[#EAE8E1] text-">Copiar link</button><button onclick="openEdit('${o.id}')" class="w-9 h-9 rounded-full bg-[#111] text-white">↗</button></div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <div id="modalNew" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="w-full max-w- bg-white rounded- p-7 max-h- overflow-auto">
      <div class="flex justify-between items-center mb-6"><div class="font-bold">Novo Pedido • Shenzhen</div><button onclick="closeNew()" class="w-8 h-8 rounded-full bg-[#FAF9F6]">✕</button></div>
      <div class="space-y-4">
        <label class="block"><div class="text- tracking-widest text-[#8A8A86] mb-1">CLIENTE</div><input id="n_cliente" class="w-full h-12 px-4 rounded- border border-[#EAE8E1] bg-[#FAF9F6]"></label>
        <label class="block"><div class="text- tracking-widest text-[#8A8A86] mb-1">PRODUTO</div><input id="n_produto" class="w-full h-12 px-4 rounded- border border-[#EAE8E1] bg-[#FAF9F6]"></label>
        <div class="grid grid-cols-2 gap-3">
          <label class="block"><div class="text- tracking-widest text-[#8A8A86] mb-1">VALOR R$</div><input id="n_valor" type="number" inputmode="decimal" placeholder="0,00" class="w-full h-12 px-4 rounded- border border-[#EAE8E1] bg-[#FAF9F6]"></label>
          <label class="block"><div class="text- tracking-widest text-[#8A8A86] mb-1">PESO</div><div class="flex gap-2"><input id="n_peso" type="number" inputmode="decimal" placeholder="0" class="flex-1 h-12 px-4 rounded- border border-[#EAE8E1] bg-[#FAF9F6]"><select id="n_pesoUn" class="w- h-12 rounded- border border-[#EAE8E1] bg-[#FAF9F6] text-"><option value="g">g</option><option value="kg" selected>kg</option></select></div></label>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <label class="block"><div class="text- tracking-widest text-[#8A8A86] mb-1">FRETE CHINA-BRASIL (R$)</div><input id="n_frete" type="number" inputmode="decimal" placeholder="0" class="w-full h-12 px-4 rounded- border border-[#EAE8E1] bg-[#FAF9F6]"></label>
          <label class="block"><div class="text- tracking-widest text-[#8A8A86] mb-1">RASTREIO</div><input id="n_rastreio" placeholder="link" class="w-full h-12 px-4 rounded- border border-[#EAE8E1] bg-[#FAF9F6]"></label>
        </div>
        <label class="block"><div class="text- tracking-widest text-[#8A8A86] mb-1">CAPA DO PRODUTO</div><input id="n_capa" type="file" accept="image/*" class="w-full text-"></label>
      </div>
      <button onclick="createOrder()" class="mt-6 w-full h-12 rounded-full bg-[#111] text-white font-semibold">Criar Pedido • Status COMPRADO</button>
    </div>
  </div>

  <div id="drawer" class="fixed inset-0 z-40 hidden"><div class="absolute inset-0 bg-black/30" onclick="closeEdit()"></div><div class="absolute right-0 top-0 h-full w-full max-w- bg-[#FAF9F6] overflow-auto border-l border-[#EAE8E1] shadow-2xl"><div id="drawerInner"></div></div></div>
  `;
}

function statCard(label,val,sub){
  return `<div class="bg-white rounded- border border-[#EAE8E1] p-6"><div class="text- tracking-[0.14em] text-[#8A8A86] mb-3">${label}</div><div class="text- font-[800] leading-none truncate">${val}</div><div class="text- text-[#8A8A86] mt-2">${sub}</div></div>`;
}
function getStatusLabel(id){ return (STATUS_LIST.find(s=>s.id===id)||STATUS_LIST[0]).label; }

function openNew(){ document.getElementById('modalNew').classList.remove('hidden'); document.getElementById('modalNew').classList.add('flex'); }
function closeNew(){ document.getElementById('modalNew').classList.add('hidden'); }
async function createOrder(){
  const cliente=document.getElementById('n_cliente').value;
  const produto=document.getElementById('n_produto').value;
  const valor=document.getElementById('n_valor').value;
  const peso=document.getElementById('n_peso').value;
  const pesoUn=document.getElementById('n_pesoUn').value;
  const frete=document.getElementById('n_frete').value;
  const rastreio=document.getElementById('n_rastreio').value;
  let capaBase=""; const file=document.getElementById('n_capa').files[0];
  if(file) capaBase=await toBase64(file);
  if(!cliente||!produto) return toast("Preencha cliente e produto");
  const o={id:genId(), cliente, produto, valor, peso, pesoUn, frete, rastreio, capa:capaBase, fotos:[], status:"COMPRADO", criadoEm:nowDate(), criadoHora:nowHour()};
  orders.unshift(o); save(); closeNew(); renderAdmin(); toast("Pedido "+o.id+" criado");
}
function toBase64(file){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(file); }); }

function openEdit(id){
  editingId=id; const o=orders.find(x=>x.id===id); if(!o) return;
  document.getElementById('drawer').classList.remove('hidden');
  document.getElementById('drawerInner').innerHTML=`
    <div class="p-7">
      <div class="flex justify-between items-start mb-6">
        <div class="flex gap-3">
          <div class="w- h- rounded- bg-white border border-[#EAE8E1] overflow-hidden flex items-center justify-center">${o.capa?`<img src="${o.capa}" class="w-full h-full object-cover">`:`📦`}</div>
          <div><div class="flex gap-2 items-center"><span class="px-2.5 py-1 rounded-full bg-[#111] text-white text- font-bold">${o.id}</span><span class="text- text-[#8A8A86]">${o.criadoEm}</span></div><div class="font-bold text- leading-tight mt-1 max-w- line-clamp-2 break-words">${o.produto}</div><div class="text- text-[#8A8A86]">${o.cliente} • ${o.peso||""}${o.pesoUn||""}</div></div>
        </div>
        <button onclick="closeEdit()" class="w-8 h-8 rounded-full bg-white border">✕</button>
      </div>

      <div class="flex gap-2 mb-6">
        <button onclick="copyLink('${o.id}')" class="flex-1 h-11 rounded-full bg-[#111] text-white text- font-semibold">● Link Cliente BR</button>
        <button onclick="window.open('?track=${o.id}','_blank')" class="flex-1 h-11 rounded-full bg-white border border-[#EAE8E1] text- font-semibold">Ver como Cliente ↗</button>
        <button onclick="openZap('${o.id}')" class="w-11 h-11 rounded-full bg-[#25D366] text-white font-bold">W</button>
      </div>

      <div class="bg-[#0E0E0E] rounded- p-5 mb-6 text-white">
        <div class="text- tracking-[0.2em] text-[#8A8A86] mb-3">STATUS ATUAL • ESCOLHA LIVRE</div>
        <select id="editStatus" onchange="changeStatus(this.value)" class="w-full h-12 rounded- bg-[#1E1E1E] border border-[#2A2A2A] px-4 text- font-bold outline-none">
          ${STATUS_LIST.map(s=>`<option value="${s.id}" ${o.status===s.id?"selected":""}>${s.label}${s.sub?" - "+s.sub:""}</option>`).join('')}
        </select>
        <div class="text- text-[#8A8A86] mt-3">Altere livremente. Não precisa seguir ordem.</div>
      </div>

      <div class="bg-white rounded- border border-[#EAE8E1] p-5 space-y-4">
        <div class="text- tracking-[0.2em] text-[#8A8A86]">DADOS DO PEDIDO • EDITÁVEL</div>
        <label><div class="text- text-[#8A8A86]">CLIENTE</div><input id="e_cliente" value="${o.cliente}" class="w-full h-11 px-4 rounded- bg-[#FAF9F6] border border-[#EAE8E1]"></label>
        <label><div class="text- text-[#8A8A86]">PRODUTO</div><input id="e_produto" value="${o.produto}" class="w-full h-11 px-4 rounded- bg-[#FAF9F6] border border-[#EAE8E1]"></label>
        <div class="grid grid-cols-2 gap-3">
          <label><div class="text- text-[#8A8A86]">VALOR R$</div><input id="e_valor" type="number" inputmode="decimal" value="${o.valor}" class="w-full h-11 px-4 rounded- bg-[#FAF9F6] border"></label>
          <label><div class="text- text-[#8A8A86]">PESO</div><div class="flex gap-2"><input id="e_peso" type="number" inputmode="decimal" value="${o.peso}" class="flex-1 h-11 px-3 rounded- bg-[#FAF9F6] border"><select id="e_pesoUn" class="w- h-11 rounded- border bg-[#FAF9F6] text-"><option value="g" ${o.pesoUn==="g"?"selected":""}>g</option><option value="kg" ${o.pesoUn!=="g"?"selected":""}>kg</option></select></div></label>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <label><div class="text- text-[#8A8A86]">FRETE CHINA-BRASIL R$</div><input id="e_frete" type="number" inputmode="decimal" value="${o.frete}" class="w-full h-11 px-4 rounded- bg-[#FAF9F6] border"></label>
          <label><div class="text- text-[#8A8A86]">RASTREIO</div><input id="e_rastreio" value="${o.rastreio}" class="w-full h-11 px-4 rounded- bg-[#FAF9F6] border"></label>
        </div>
        <label><div class="text- text-[#8A8A86]">TROCAR CAPA</div><input id="e_capa" type="file" accept="image/*" class="w-full text- mt-1"></label>
        <div class="flex gap-2 pt-2"><button onclick="saveEdit()" class="flex-1 h-11 rounded-full bg-[#111] text-white font-semibold">Salvar alterações</button></div>

        <div class="pt-6 border-t border-[#EAE8E1]">
          <div class="flex justify-between items-center mb-3"><div class="text- tracking-widest">FOTOS REAIS GALPÃO • QC (${o.fotos.length})</div><label class="text- px-3 py-1.5 rounded-full bg-[#111] text-white cursor-pointer">+ Adicionar<input id="e_fotos" type="file" multiple accept="image/*" class="hidden" onchange="addFotos(this)"></label></div>
          <div class="grid grid-cols-3 gap-2">${o.fotos.map((f,i)=>`<div class="relative group"><img src="${f}" class="w-full h- object-cover rounded- border"><button onclick="removeFoto(${i})" class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-black text-white text-">✕</button></div>`).join('')||`<div class="col-span-3 py-8 text-center text- text-[#8A8A86] border border-dashed rounded-">Nenhuma foto ainda. Suba as fotos reais do galpão Shenzhen.</div>`}</div>
        </div>
      </div>

      <button onclick="askDelete('${o.id}')" class="mt-8 w-full h-12 rounded-full border border-red-200 text-[#FF3B30] font-semibold text-">🗑️ Excluir pedido ${o.id}</button>
      <div class="text- text-center text-[#8A8A86] mt-2">Ação irreversível • Remove do localStorage</div>
    </div>
  `;
}
function closeEdit(){ document.getElementById('drawer').classList.add('hidden'); editingId=null; }
function saveEdit(){
  const o=orders.find(x=>x.id===editingId); if(!o) return;
  o.cliente=document.getElementById('e_cliente').value;
  o.produto=document.getElementById('e_produto').value;
  o.valor=document.getElementById('e_valor').value;
  o.peso=document.getElementById('e_peso').value;
  o.pesoUn=document.getElementById('e_pesoUn').value;
  o.frete=document.getElementById('e_frete').value;
  o.rastreio=document.getElementById('e_rastreio').value;
  const file=document.getElementById('e_capa').files[0];
  if(file){ toBase64(file).then(b=>{o.capa=b; save(); renderAdmin(); closeEdit(); toast("Salvo");}); } else { save(); renderAdmin(); closeEdit(); toast("Salvo"); }
}
function changeStatus(v){ const o=orders.find(x=>x.id===editingId); if(o){ o.status=v; save(); renderAdmin(); openEdit(editingId); } }
async function addFotos(input){ const o=orders.find(x=>x.id===editingId); for(const f of input.files){ o.fotos.push(await toBase64(f)); } save(); openEdit(editingId); }
function removeFoto(i){ const o=orders.find(x=>x.id===editingId); o.fotos.splice(i,1); save(); openEdit(editingId); }
function askDelete(id){ if(confirm("Excluir "+id+"? Ação irreversível")){ orders=orders.filter(o=>o.id!==id); save(); closeEdit(); renderAdmin(); toast("Excluído"); } }
function copyLink(id){ const url=location.origin+location.pathname+"?track="+id; navigator.clipboard.writeText(url); toast("Link copiado: "+id); }
function openZap(id){ const o=orders.find(x=>x.id===id); const url=location.origin+location.pathname+"?track="+id; const msg=encodeURIComponent(`Olá ${o.cliente}! Seu pedido ${o.id} - ${o.produto} - Status: ${getStatusLabel(o.status)} - Acompanhe: ${url} - Jaguarara Imports | Galpão Shenzhen`); window.open("https://wa.me/?text="+msg,"_blank"); }
function logout(){ localStorage.removeItem('jg_auth'); location.href=location.pathname; }

function renderClient(){
  const id=getTrackId(); const o=orders.find(x=>x.id===id);
  if(!o){ document.getElementById('app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-10 text-center">Pedido ${id} não encontrado.<br><a href="${location.pathname}" class="underline">Voltar</a></div>`; return; }
  const idx=STATUS_LIST.findIndex(s=>s.id===o.status);
  document.getElementById('app').innerHTML=`
  <div class="min-h-screen bg-[#FAF9F6]">
    <header class="h- bg-white border-b border-[#EAE8E1] flex items-center justify-between px-6 sticky top-0 z-10"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-[#111] text-white flex items-center justify-center">🐆</div><div class="font-black text-">JAGUARARA IMPORTS</div></div><button onclick="copyLink('${o.id}')" class="h-9 px-4 rounded-full bg-[#111] text-white text-">Copiar link</button></header>
    <div class="max-w- mx-auto p-4 md:p-6">
      <div class="bg-white rounded- border border-[#EAE8E1] overflow-hidden shadow-[0_8px_40px_rgba(0,0,0,0.04)]">
        <div class="p-5">
          <div class="w-full aspect-[4/3] rounded- overflow-hidden bg-[#FAF9F6] border border-[#EAE8E1] mb-4 flex items-center justify-center">
            ${o.capa?`<img src="${o.capa}" class="w-full h-full object-cover">`:`<div class="text-">📦</div>`}
          </div>
          <div class="flex gap-2 items-center mb-3"><span class="px-3 py-1 rounded-full bg-[#111] text-white text- font-bold">${o.id}</span><span class="text- text-[#8A8A86]">${o.criadoEm}</span><span class="ml-auto px-2.5 py-1 rounded-full bg-[#111] text-white text- tracking-widest">PEDIDO PREMIUM • GALPÃO SHENZHEN</span></div>
          <h1 class="text- font-[800] leading-[1.15] break-words">${o.produto}</h1>
          <div class="text- text-[#8A8A86] mt-2 break-words">Cliente ${o.cliente} • ${o.peso||""}${o.pesoUn||""} • Frete R$ ${o.frete||0} • Valor R$ ${o.valor} • Acompanhamento direto do galpão Shenzhen, Guangdong, China.</div>

          <div class="grid grid-cols-3 gap-3 mt-6">
            <div class="bg-[#FAF9F6] rounded- p-4 border border-[#EAE8E1]"><div class="text- tracking-widest text-[#8A8A86]">VALOR PAGO</div><div class="font-bold text- mt-1">R$ ${o.valor||0}</div></div>
            <div class="bg-[#FAF9F6] rounded- p-4 border border-[#EAE8E1]"><div class="text- tracking-widest text-[#8A8A86]">PESO REAL</div><div class="font-bold text- mt-1">${o.peso||""}${o.pesoUn||""}</div></div>
            <div class="bg-[#FAF9F6] rounded- p-4 border border-[#EAE8E1]"><div class="text- tracking-widest text-[#8A8A86]">STATUS</div><div class="font-bold text- mt-1 leading-tight">${getStatusLabel(o.status)}</div></div>
          </div>
        </div>

        <div class="px-5 pb-6">
          <div class="bg-white rounded- border border-[#EAE8E1] p-5">
            <div class="text- tracking-[0.14em] font-bold mb-6">PROGRESSÃO DO SEU PEDIDO</div>
            <div class="relative">
              <div class="absolute left- top- bottom- w- bg-[#EAE8E1]"></div>
              <div class="absolute left- top- w- bg-[#009739] transition-all" style="height:${(idx/(STATUS_LIST.length-1))*100}%"></div>
              <div class="space-y-7">
                ${STATUS_LIST.map((s,i)=>{
                  const done=i<=idx; const now=i===idx;
                  return `<div class="flex gap-4 relative">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center z-10 flex-shrink-0 ${done?'bg-[#009739] text-white':'bg-white border-2 border-[#EAE8E1] text-[#8A8A86]'} ${now?'ring-4 ring-[#FFD60A]/30':''}">${done?'✓':'○'}</div>
                    <div class="flex-1 min-w-0 -mt-1">
                      <div class="flex gap-2 items-center flex-wrap"><div class="font-bold text- ${done?'text-[#111]':'text-[#8A8A86]'}">${s.label}</div>${now?`<span class="px-2 py-0.5 rounded-full bg-[#FFD60A] text- font-bold tracking-widest">AGORA</span>`:''}</div>
                      ${s.sub?`<div class="text- text-[#8A8A86] tracking-wide">${s.sub}</div>`:''}
                      <div class="text- text-[#8A8A86] mt-1">${s.desc}</div>
                      ${now?`<div class="text- text-[#8A8A86] mt-1">${o.criadoHora} • Galpão Shenzhen, Guangdong, China</div>`:''}
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>
          </div>
        </div>

        <div class="px-5 pb-6">
          <div class="bg-white rounded- border border-[#EAE8E1] p-5">
            <div class="flex justify-between items-center mb-4"><div class="text- tracking-[0.14em] font-bold">FOTOS REAIS DO GALPÃO • QC</div><div class="text- px-2.5 py-1 rounded-full bg-[#FAF9F6] border">${o.fotos.length} fotos</div></div>
            ${o.fotos.length?`<div class="grid grid-cols-3 gap-2">${o.fotos.map(f=>`<img src="${f}" class="w-full h- object-cover rounded- border border-[#EAE8E1] cursor-pointer" onclick="window.open('${f}')">`).join('')}</div>`:`<div class="py-10 text-center bg-[#FAF9F6] rounded- border border-dashed border-[#EAE8E1]"><div class="font-semibold text-">Fotos em produção</div><div class="text- text-[#8A8A86] mt-1 max-w- mx-auto">Nossa equipe no galpão de Shenzhen vai subir as fotos reais em breve.</div></div>`}
          </div>
        </div>
      </div>

      <div class="text-center py-8 text- text-[#8A8A86] tracking-wide">© 2026 JAGUARARA IMPORTS - Conectando o Brasil ao Mundo<br>Galpão Shenzhen, Guangdong, China • Sugargoo Partner</div>
    </div>
  </div>`;
}

(function init(){
  load();
  if(isClientView()){ renderClient(); return; }
  if(localStorage.getItem('jg_auth')==='1'){ renderAdmin(); } else { loginView(); }
})();
</script>
</body>
