function compressImage(file, maxW=1280, quality=0.7){
return new Promise((resolve,reject)=>{
  let reader=new FileReader();
  reader.onload=e=>{
    let img=new Image();
    img.onload=()=>{
      let canvas=document.createElement("canvas");
      let w=img.width, h=img.height;
      if(w>maxW){h=(maxW/w)*h; w=maxW;}
      if(h>maxW){w=(maxW/h)*w; h=maxW;}
      canvas.width=w; canvas.height=h;
      let ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror=reject;
    img.src=e.target.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
});
}

if(hasWeight){ boxesHtml += `<div class="bg-[#F6F5F1] rounded-[20px] border border-[#EDEBE6] p-5"><div class="text-[10px] font-bold tracking-[0.16em] text-zinc-400 uppercase">Peso Real</div><div class="font-black text-[18px] mt-2">${o.peso}${o.pesoUn||"g"}</div><div class="text-[11px] text-zinc-500 mt-1">conferido</div></div>`; }
if(hasFreteBR){ boxesHtml += `<div class="bg-[#0A0A0A] rounded-[20px] p-5 text-white"><div class="text-[10px] font-bold tracking-[0.16em] text-white/50 uppercase">Frete Internacional</div><div class="font-black text-[18px] mt-2">R$ ${o.freteBR}</div><div class="text-[11px] text-white/60 mt-1">China → Brasil</div></div>`; }
app.innerHTML=`
<div class="min-h-screen bg-[#F6F5F1] py-6 px-4">
<div class="max-w-[720px] mx-auto">
<div class="flex justify-between items-center mb-6"><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-[12px] bg-black text-white grid place-items-center">🐆</div><div class="font-black text-[13px] leading-none">JAGUARARA<br>IMPORTS</div></div><div class="text-[11px] px-3 py-1 rounded-full bg-black text-white font-bold">SHENZHEN • PREMIUM</div></div>
<div class="bg-white rounded-[32px] border shadow-[0_16px_48px_rgba(0,0,0,0.08)] overflow-hidden">
<div class="h-[4px] bg-gradient-to-r from-[#009739] via-[#FFD60A] to-[#002776]"></div>
<div class="p-6 md:p-8">
<div class="flex items-center gap-4 mb-6"><div class="w-14 h-14 rounded-full bg-black text-white grid place-items-center font-bold text-[18px]">${o.cliente[0]?.toUpperCase()||"C"}</div><div><div class="text-[11px] tracking-widest text-zinc-400 font-bold uppercase">Cliente Premium</div><div class="font-black text-[22px] leading-none mt-1">Olá, ${o.cliente} 👋</div><div class="text-[13px] text-zinc-500 mt-1">Galpão Shenzhen, Guangdong, China</div></div></div>
<div class="w-full aspect-[4/3] rounded-[24px] overflow-hidden bg-[#F6F5F1] border">${o.capa?`<img src="${o.capa}" class="w-full h-full object-cover">`:`<div class="w-full h-full grid place-items-center text-[40px]">📦</div>`}</div>
<div class="mt-5"><div class="flex gap-2"><span class="px-3 py-1 rounded-full bg-black text-white text-[11px] font-bold">${o.id}</span><span class="text-[11px] text-zinc-500">${o.criadoEm}</span></div><div class="font-black text-[22px] leading-[1.15] mt-3 break-words">${o.produto}</div><div class="text-[12px] text-zinc-500 mt-2">Cód: ${o.rastreio||"—"}</div></div>
<div class="mt-6 grid grid-cols-2 md:grid-cols-3 gap-3">${boxesHtml}</div>
<div class="mt-8"><div class="flex items-center justify-between"><div class="text-[11px] font-black tracking-widest uppercase">Progressão Vertical</div><div class="text-[11px] px-2.5 py-1 rounded-full bg-[#F6F5F1] border font-bold">${idx+1} de ${STEPS.length}</div></div>
<div class="mt-6 relative"><div class="absolute left-[15px] top-2 bottom-2 w-[2px] bg-[#F0EFEB]"></div><div class="absolute left-[15px] top-2 w-[2px] bg-black" style="height:${(idx/(STEPS.length-1))*100}%"></div><div class="space-y-0">${STEPS.map((s,i)=>{let done=i<=idx; let curr=i===idx; return `<div class="flex gap-4"><div class="flex flex-col items-center"><div class="w-[32px] h-[32px] rounded-full border-2 grid place-items-center text-[12px] font-bold ${done?'bg-black border-black text-white':'bg-white border-[#EDEBE6] text-zinc-300'} ${curr?'ring-4 ring-[#FFD60A]/30':''}">${done?'✓':''}</div>${i<STEPS.length-1?`<div class="w-[2px] flex-1 mt-2 ${i<idx?'bg-black':'bg-[#F0EFEB]'} min-h-[28px]"></div>`:''}</div><div class="flex-1 pb-8 -mt-1"><div class="flex gap-2 items-center"><span class="font-bold text-[13px] ${curr?'text-black':done?'text-black':'text-zinc-400'}">${s.label}</span>${curr?'<span class="text-[9px] font-black px-2 py-0.5 rounded-full bg-[#FFD60A]">AGORA</span>':''}</div>${s.sub?`<div class="text-[10px] text-zinc-400 mt-0.5">${s.sub}</div>`:''}<div class="text-[12px] text-zinc-600 mt-1">${s.desc}</div></div></div>`;}).join("")}</div></div></div>

// FUNÇÕES GLOBAIS - NÃO PERDEM MAIS O EVENTO
function logout(){ localStorage.removeItem(AUTH_KEY); location.reload(); }
function openDel(){ pendingDel=sel; document.getElementById("delId").textContent=sel; document.getElementById("delBg").classList.remove("hidden"); document.getElementById("delModal").classList.remove("hidden"); }
function closeDel(){document.getElementById("delBg").classList.add("hidden"); document.getElementById("delModal").classList.add("hidden"); pendingDel=null;}
function confirmDelete(){ if(!pendingDel) return; orders=orders.filter(x=>x.id!==pendingDel); localStorage.setItem(KEY,JSON.stringify(orders)); closeDel(); closeDrawer(); renderAdminList(); toast("Excluído"); }
function copyLink(){ let url=location.origin+location.pathname+"?track="+sel; navigator.clipboard.writeText(url); toast("Link copiado: "+sel); }
function clearPending(){ pendingQc=[]; document.getElementById("qcPendingWrap").classList.add("hidden"); document.getElementById("qcPendingGrid").innerHTML=""; }
function changeStatus(val){
  let o=orders.find(x=>x.id===sel); if(!o) return;
  o.status=val;
  localStorage.setItem(KEY,JSON.stringify(orders));
  toast("Status → "+val+" • Salvo automático");
  renderAdminList();
}
function saveCurrentOrder(){
  let o=orders.find(x=>x.id===sel); if(!o) { toast("Erro: pedido não encontrado"); return; }
  o.cliente=document.getElementById("eCli").value;
  o.produto=document.getElementById("eProd").value;
  o.valor=parseFloat(document.getElementById("eVal").value)||0;
  o.peso=document.getElementById("ePeso").value;
  o.pesoUn=document.getElementById("ePesoUn").value;
  o.freteInterno=document.getElementById("eFreteInt").value;
  o.freteBR=document.getElementById("eFreteBR").value;
  o.rastreio=document.getElementById("eRast").value;
  if(window.tempEditCapa) o.capa=window.tempEditCapa;

  if(pendingQc.length>0){
    let espaco=10-o.fotos.length;
    let paraAdd=pendingQc.slice(0,espaco);
    o.fotos.push(...paraAdd);
    pendingQc=[];
    document.getElementById("qcPendingWrap").classList.add("hidden");
    document.getElementById("qcPendingGrid").innerHTML="";
    toast(`✅ ${paraAdd.length} fotos QC salvas • Total ${o.fotos.length}/10 • Cliente já vê`);
  } else {
    toast("✅ Pedido salvo • Cliente já vê atualizado");
  }

  localStorage.setItem(KEY,JSON.stringify(orders));
  renderQcGrid(o);
  renderAdminList();
}
function removeQc(i){ let o=orders.find(x=>x.id===sel); if(!o) return; o.fotos.splice(i,1); localStorage.setItem(KEY,JSON.stringify(orders)); renderQcGrid(o); renderAdminList(); toast("Foto removida"); }
function openQcFull(src){ document.getElementById("qcFullImg").src=src; document.getElementById("qcFull").classList.remove("hidden"); }

(function(){
let track=new URLSearchParams(location.search).get("track");
if(track){renderClientPage(track); return;}
if(isLogged()){renderAdminPage();} else {renderLogin();}
})();
window.openNew=openNew;
window.closeNew=closeNew;
window.openDrawer=openDrawer;
window.closeDrawer=closeDrawer;
window.logout=logout;
window.openDel=openDel;
window.closeDel=closeDel;
window.confirmDelete=confirmDelete;
window.copyLink=copyLink;
window.clearPending=clearPending;
window.changeStatus=changeStatus;
window.saveCurrentOrder=saveCurrentOrder;
window.removeQc=removeQc;
window.openQcFull=openQcFull;
window.createOrder=createOrder;
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
