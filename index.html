<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAGUARARA IMPORTS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif;box-sizing:border-box} *{border-radius:0} /* reset pra forçar radius certo */</style>
</head>
<body class="bg-[#FAF8F4]">
<div id="app"></div>
<script>
const SENHA="sazgir-gaxxoh-0mIdno"; const KEY="jaguarara_v7_final";
const STATUS=[
{id:"COMPRADO",label:"COMPRADO"},
{id:"CHEGOU_GALPAO",label:"CHEGOU NO GALPÃO - SHENZHEN"},
{id:"INSPECAO_QC",label:"INSPEÇÃO QC"},
{id:"ENVIADO_BRASIL",label:"ENVIADO AO BRASIL"},
{id:"ENTREGUE",label:"ENTREGUE"}
];
let orders=JSON.parse(localStorage.getItem(KEY)||"[]");
let editing=null; let q="";
const save=()=>localStorage.setItem(KEY,JSON.stringify(orders));
const gen=()=>"JG-"+Math.floor(100000+Math.random()*899999);
const toast=m=>{let d=document.createElement("div");d.className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-3 rounded-full text- font-bold z-[999]";d.innerText=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}

function login(){
document.getElementById("app").innerHTML=`
<div class="min-h-screen bg-[#0E0E0E] flex items-center justify-center p-5">
<div class="w-full max-w- bg-white rounded- p-8 shadow-[0_20px_80px_rgba(0,0,0,0.3)]">
<div class="w-12 h-12 rounded-full bg-black flex items-center justify-center text- mb-6">🐆</div>
<div class="text- font-[900] leading-[1] mb-2">JAGUARARA<br>IMPORTS</div>
<div class="text- tracking-[0.2em] text-zinc-400 mb-8">GALPÃO SHENZHEN • GUANGDONG, CHINA</div>
<input id="pw" type="password" placeholder="Senha de acesso" class="w-full h- rounded-full bg-[#F6F4EF] border border-[#ECE9E2] px-6 outline-none">
<button onclick="tryLogin()" class="w-full h- rounded-full bg-black text-white font-bold mt-4">Entrar no Galpão</button>
</div></div>`;
}
function tryLogin(){if(document.getElementById("pw").value===SENHA){localStorage.setItem("jg_auth","1");renderAdmin()}else{toast("Senha incorreta")}}

function renderAdmin(){
let list=orders.filter(o=>(o.id+o.cliente+o.produto).toLowerCase().includes(q.toLowerCase()));
let total=list.length; let fat=list.reduce((s,o)=>s+(+o.valor||0),0);
document.getElementById("app").innerHTML=`
<div class="min-h-screen bg-[#FAF8F4]">
<header class="sticky top-0 z-10 bg-[#0E0E0E] text-white px-5 md:px-8 h- flex items-center justify-between">
<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-white text-black grid place-items-center">🐆</div><div class="leading-tight"><div class="font-black text-">JAGUARARA IMPORTS</div><div class="text- tracking-[0.2em] text-white/50">ADMIN • SHENZHEN</div></div></div>
<div class="flex gap-2"><button onclick="openNew()" class="h- px-5 rounded-full bg-white text-black text- font-bold">+ Novo</button><button onclick="logout()" class="h- px-4 rounded-full bg-white/10 text-">Sair</button></div>
</header>

<div class="max-w- mx-auto p-4 md:p-8">
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6">
${cardStat("TOTAL PEDIDOS",total,"ativos")}${cardStat("FATURAMENTO","R$ "+fat.toFixed(2),"estimado")}${cardStat("NO GALPÃO",orders.filter(o=>o.status!=="ENTREGUE").length,"Shenzhen")}${cardStat("ENVIADOS",orders.filter(o=>o.status==="ENVIADO_BRASIL").length,"em trânsito")}
</div>

<input oninput="q=this.value;renderAdmin()" value="${q}" placeholder="Buscar JG-, cliente, produto" class="w-full h- rounded-full bg-white border border-[#ECE9E2] px-6 mb-6 shadow-sm outline-none">

<div class="bg-white rounded- border border-[#ECE9E2] shadow-[0_8px_30px_rgba(0,0,0,0.04)] overflow-hidden">
<div class="px-6 py-4 flex justify-between items-center border-b border-[#F2F0EB]"><span class="text- font-black tracking-[0.2em]">PEDIDOS • SHENZHEN</span><span class="text- text-zinc-400">${list.length} pedidos</span></div>
${list.length===0?`<div class="py-20 text-center"><div class="font-bold">Nenhum pedido ainda</div><div class="text- text-zinc-400 mt-1">Clique em + Novo</div></div>`:
list.map(o=>`
<div class="px-5 py-4 flex gap-4 items-center hover:bg-[#FAF8F4] transition cursor-pointer border-b border-[#F7F5F1] last:border-0">
<div class="w- h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] overflow-hidden grid place-items-center flex-shrink-0">${o.capa?`<img src="${o.capa}" class="w-full h-full object-cover">`:`📦`}</div>
<div class="flex-1 min-w-0" onclick="openEdit('${o.id}')"><div class="flex gap-2 mb-1"><span class="px-2.5 py-1 rounded-full bg-black text-white text- font-black">${o.id}</span><span class="px-2.5 py-1 rounded-full bg-[#F6F4EF] border text- font-bold">${o.status.replace("_"," ")}</span></div><div class="font-bold text- truncate">${o.produto}</div><div class="text- text-zinc-500 truncate">${o.cliente} • ${o.peso||0}${o.pesoUn||""}</div></div>
<div class="flex flex-col items-end gap-2"><div class="font-black text-">R$ ${o.valor||0}</div><button onclick="copyLink('${o.id}')" class="h-8 px-3 rounded-full bg-black text-white text-">Link</button></div>
</div>`).join('')}
</div>
</div>
</div>

<div id="mNew" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-sm p-4 place-items-center"><div class="w-full max-w- bg-white rounded- p-7 shadow-2xl max-h- overflow-auto">
<div class="flex justify-between items-center mb-6"><div class="font-black text-">Novo Pedido • Shenzhen</div><button onclick="closeNew()" class="w-9 h-9 rounded-full bg-[#F6F4EF]">✕</button></div>
<div class="space-y-4">
<div><div class="text- tracking-widest text-zinc-400 mb-2">CLIENTE</div><input id="nc" class="w-full h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] px-5 outline-none"></div>
<div><div class="text- tracking-widest text-zinc-400 mb-2">PRODUTO</div><input id="np" class="w-full h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] px-5 outline-none"></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<div><div class="text- tracking-widest text-zinc-400 mb-2">VALOR R$</div><input id="nv" type="number" inputmode="decimal" placeholder="0,00" class="w-full h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] px-5 outline-none"></div>
<div><div class="text- tracking-widest text-zinc-400 mb-2">PESO</div><div class="flex gap-2"><input id="npe" type="number" inputmode="decimal" placeholder="0" class="flex-1 h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] px-5 outline-none"><select id="npeU" class="w- h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] px-3"><option value="kg">kg</option><option value="g">g</option></select></div></div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<div><div class="text- tracking-widest text-zinc-400 mb-2">FRETE CHINA-BRASIL R$</div><input id="nf" type="number" inputmode="decimal" placeholder="0" class="w-full h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] px-5 outline-none"></div>
<div><div class="text- tracking-widest text-zinc-400 mb-2">RASTREIO</div><input id="nr" placeholder="link" class="w-full h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] px-5 outline-none"></div>
</div>
<div><div class="text- tracking-widest text-zinc-400 mb-2">CAPA DO PRODUTO</div><input id="nca" type="file" accept="image/*" class="w-full text- file:mr-3 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-black file:text-white"></div>
<button onclick="create()" class="w-full h- rounded-full bg-black text-white font-black mt-2">Criar Pedido • COMPRADO</button>
</div>
</div></div>

<div id="drawer" class="fixed inset-0 z-40 hidden"><div class="absolute inset-0 bg-black/30" onclick="closeEdit()"></div><div class="absolute right-0 top-0 h-full w-full max-w- bg-[#FAF8F4] overflow-auto"><div id="dIn" class="p-6"></div></div></div>
`;
}
function cardStat(l,v,s){return `<div class="bg-white rounded- border border-[#ECE9E2] p-5 shadow-sm"><div class="text- tracking-[0.2em] text-zinc-400">${l}</div><div class="text- font-[900] mt-2 leading-none">${v}</div><div class="text- text-zinc-400 mt-2">${s}</div></div>`}
function openNew(){document.getElementById("mNew").classList.remove("hidden");document.getElementById("mNew").classList.add("grid")}
function closeNew(){document.getElementById("mNew").classList.add("hidden")}
async function create(){
let c=document.getElementById("nc").value, p=document.getElementById("np").value, v=document.getElementById("nv").value, pe=document.getElementById("npe").value, peU=document.getElementById("npeU").value, f=document.getElementById("nf").value, r=document.getElementById("nr").value;
if(!c||!p){toast("Preencha cliente e produto");return;}
let capa=""; let file=document.getElementById("nca").files[0]; if(file){capa=await new Promise(res=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(file);});}
orders.unshift({id:gen(),cliente:c,produto:p,valor:v,peso:pe,pesoUn:peU,frete:f,rastreio:r,capa,fotos:[],status:"COMPRADO",data:new Date().toLocaleDateString("pt-BR"),hora:new Date().toLocaleTimeString("pt-BR")}); save(); closeNew(); renderAdmin(); toast("Criado!");
}
function openEdit(id){
editing=id; let o=orders.find(x=>x.id===id);
document.getElementById("drawer").classList.remove("hidden");
document.getElementById("dIn").innerHTML=`
<div class="flex justify-between items-start mb-6"><div class="flex gap-3"><div class="w- h- rounded- bg-white border overflow-hidden grid place-items-center">${o.capa?`<img src="${o.capa}" class="w-full h-full object-cover">`:`📦`}</div><div><div class="px-2.5 py-1 rounded-full bg-black text-white text- font-black inline-block">${o.id}</div><div class="font-black text- leading-tight mt-1 max-w- break-words">${o.produto}</div><div class="text- text-zinc-500">${o.cliente}</div></div></div><button onclick="closeEdit()" class="w-9 h-9 rounded-full bg-white border">✕</button></div>

<div class="bg-black text-white rounded- p-5 mb-5"><div class="text- tracking-[0.2em] text-white/50 mb-3">STATUS ATUAL • ESCOLHA LIVRE</div><select id="stSel" onchange="upSt(this.value)" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4 font-bold">${STATUS.map(s=>`<option value="${s.id}" ${o.status===s.id?"selected":""}>${s.label}</option>`).join("")}</select></div>

<div class="bg-white rounded- border border-[#ECE9E2] p-5 space-y-4 shadow-sm">
<div class="text- tracking-widest text-zinc-400">DADOS EDITÁVEIS</div>
<input id="ec" value="${o.cliente}" class="w-full h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] px-4">
<input id="ep" value="${o.produto}" class="w-full h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] px-4">
<div class="grid grid-cols-2 gap-3"><input id="ev" type="number" inputmode="decimal" value="${o.valor}" class="h- rounded- bg-[#F6F4EF] border border-[#ECE9E2] px-4"><div class="flex gap-2"><input id="epe" type="number" value="${o.peso}" class="flex-1 h- rounded- bg-[#F6F4EF] border px-3"><select id="epeU" class="w- h- rounded- bg-[#F6F4EF] border"><option value="kg" ${o.pesoUn!=="g"?"selected":""}>kg</option><option value="g" ${o.pesoUn==="g"?"selected":""}>g</option></select></div></div>
<div class="grid grid-cols-2 gap-3"><input id="ef" type="number" value="${o.frete}" class="h- rounded- bg-[#F6F4EF] border px-4"><input id="er" value="${o.rastreio}" class="h- rounded- bg-[#F6F4EF] border px-4"></div>
<input id="eca" type="file" accept="image/*" class="w-full text-">
<button onclick="saveE()" class="w-full h- rounded-full bg-black text-white font-bold mt-2">Salvar alterações</button>

<div class="pt-5 border-t border-[#F2F0EB]"><div class="text- tracking-widest mb-3">FOTOS QC (${o.fotos.length})</div><div class="grid grid-cols-3 gap-2">${o.fotos.map((f,i)=>`<div class="relative"><img src="${f}" class="w-full h- object-cover rounded- border"><button onclick="delF(${i})" class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-black text-white text-">✕</button></div>`).join("")||`<div class="col-span-3 py-8 text-center text- text-zinc-400 border border-dashed rounded-">Nenhuma foto ainda</div>`}</div><label class="mt-3 block text-center h-10 leading-10 rounded-full border border-dashed text- cursor-pointer">+ Adicionar fotos<input id="efotos" type="file" multiple accept="image/*" class="hidden" onchange="addF(this)"></label></div>
</div>

<button onclick="askDel('${o.id}')" class="w-full h- rounded-full border border-red-200 text-red-500 font-bold mt-6">Excluir ${o.id}</button>
`;
}
function closeEdit(){document.getElementById("drawer").classList.add("hidden")}
function upSt(v){let o=orders.find(x=>x.id===editing);o.status=v;save();renderAdmin();openEdit(editing);}
async function saveE(){let o=orders.find(x=>x.id===editing);o.cliente=document.getElementById("ec").value;o.produto=document.getElementById("ep").value;o.valor=document.getElementById("ev").value;o.peso=document.getElementById("epe").value;o.pesoUn=document.getElementById("epeU").value;o.frete=document.getElementById("ef").value;o.rastreio=document.getElementById("er").value;let f=document.getElementById("eca").files[0];if(f){o.capa=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});}save();renderAdmin();closeEdit();toast("Salvo");}
async function addF(i){let o=orders.find(x=>x.id===editing);for(let f of i.files){let b=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});o.fotos.push(b);}save();openEdit(editing);}
function delF(i){let o=orders.find(x=>x.id===editing);o.fotos.splice(i,1);save();openEdit(editing);}
function askDel(id){if(confirm("Excluir "+id+"?")){orders=orders.filter(o=>o.id!==id);save();closeEdit();renderAdmin();}}
function copyLink(id){let url=location.origin+location.pathname+"?track="+id;navigator.clipboard.writeText(url);toast("Link copiado");}
function logout(){localStorage.removeItem("jg_auth");location.href=location.pathname;}

function renderClient(){
let id=new URLSearchParams(location.search).get("track"); let o=orders.find(x=>x.id===id); if(!o){document.getElementById("app").innerHTML="Pedido não encontrado";return;}
let idx=STATUS.findIndex(s=>s.id===o.status);
document.getElementById("app").innerHTML=`
<div class="min-h-screen bg-[#FAF8F4]"><header class="h- bg-white border-b border-[#ECE9E2] flex items-center justify-between px-5 sticky top-0"><div class="flex gap-2 items-center"><div class="w-8 h-8 rounded-full bg-black text-white grid place-items-center">🐆</div><div class="font-black text-">JAGUARARA IMPORTS</div></div><button onclick="copyLink('${o.id}')" class="h-9 px-4 rounded-full bg-black text-white text- font-bold">Copiar link</button></header>
<div class="max-w- mx-auto p-4">
<div class="bg-white rounded- border border-[#ECE9E2] shadow-sm overflow-hidden">
<div class="p-5">
<div class="w-full rounded- overflow-hidden bg-[#F6F4EF] border border-[#ECE9E2] aspect-[4/3] grid place-items-center">${o.capa?`<img src="${o.capa}" class="w-full h-full object-cover">`:`📦`}</div>
<div class="flex gap-2 mt-4 flex-wrap"><span class="px-3 py-1 rounded-full bg-black text-white text- font-black">${o.id}</span><span class="px-3 py-1 rounded-full bg-[#F6F4EF] border text- font-bold">GALPÃO SHENZHEN • GUANGDONG</span><span class="text- text-zinc-400 ml-auto">${o.data}</span></div>
<h1 class="text- font-[900] leading-[1.1] mt-4 break-words">${o.produto}</h1>
<p class="text- text-zinc-500 mt-2">Cliente ${o.cliente} • ${o.peso||0}${o.pesoUn||""} • Frete R$ ${o.frete||0} • Valor R$ ${o.valor}</p>
<div class="grid grid-cols-3 gap-3 mt-6">
<div class="bg-[#F6F4EF] rounded- p-4 border border-[#ECE9E2]"><div class="text- tracking-widest text-zinc-400">VALOR PAGO</div><div class="font-black mt-1">R$ ${o.valor}</div></div>
<div class="bg-[#F6F4EF] rounded- p-4 border border-[#ECE9E2]"><div class="text- tracking-widest text-zinc-400">PESO REAL</div><div class="font-black mt-1">${o.peso||0}${o.pesoUn||""}</div></div>
<div class="bg-[#F6F4EF] rounded- p-4 border border-[#ECE9E2]"><div class="text- tracking-widest text-zinc-400">STATUS</div><div class="font-black mt-1 text- leading-tight">${o.status.replace("_"," ")}</div></div>
</div>
</div>

<div class="px-5 pb-5"><div class="bg-white rounded- border border-[#ECE9E2] p-6">
<div class="text- font-black tracking-[0.2em] mb-6">PROGRESSÃO DO SEU PEDIDO • VERTICAL</div>
<div class="relative">
<div class="absolute left- top-2 bottom-2 w- bg-[#ECE9E2]"></div>
<div class="absolute left- top-2 w- bg-black" style="height:${(idx/(STATUS.length-1))*100}%"></div>
<div class="space-y-8">
${STATUS.map((s,i)=>{let done=i<=idx; let now=i===idx; return `<div class="flex gap-4"><div class="w-8 h-8 rounded-full grid place-items-center z-10 flex-shrink-0 ${done?'bg-black text-white':'bg-white border-2 border-[#ECE9E2] text-zinc-300'} ${now?'ring-4 ring-yellow-300':''}">${done?'✓':'○'}</div><div class="flex-1 -mt-1"><div class="flex gap-2 items-center"><div class="font-black text- ${done?'':'text-zinc-400'}">${s.label}</div>${now?'<span class="px-2 py-0.5 rounded-full bg-yellow-300 text- font-black">AGORA</span>':''}</div><div class="text- text-zinc-500 mt-1">${now?o.hora+' • Galpão Shenzhen, Guangdong, China':''}</div></div></div>`}).join("")}
</div>
</div>
</div></div>

<div class="mt-4 bg-white rounded- border border-[#ECE9E2] p-5"><div class="flex justify-between mb-4"><div class="text- font-black tracking-widest">FOTOS REAIS • QC</div><div class="text- bg-[#F6F4EF] border px-2 py-1 rounded-full">${o.fotos.length} fotos</div></div>
${o.fotos.length?`<div class="grid grid-cols-3 gap-2">${o.fotos.map(f=>`<img src="${f}" class="w-full h- object-cover rounded- border">`).join("")}</div>`:`<div class="py-12 text-center bg-[#F6F4EF] rounded- border border-dashed"><div class="font-bold text-">Fotos em produção</div><div class="text- text-zinc-500 mt-1">Equipe em Shenzhen vai subir em breve</div></div>`}
</div>

</div>
<div class="text-center py-8 text- text-zinc-400">© 2026 JAGUARARA IMPORTS • Galpão Shenzhen, Guangdong, China</div>
</div></div>`;
}

(function(){let t=new URLSearchParams(location.search).get("track");if(t){renderClient();return;}if(localStorage.getItem("jg_auth")==="1"){renderAdmin();}else{login();}})();
</script>
</body>
</html>
