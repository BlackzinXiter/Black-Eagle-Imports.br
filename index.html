function genClientKey(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r=''; for(let i=0;i<12;i++) r+=chars[Math.floor(Math.random()*chars.length)];
  return 'JG-CLI-'+r.slice(0,4)+'-'+r.slice(4,8)+'-'+r.slice(8,12);
}

function getTrackId(){

  if(hash.includes('track=')) return hash.split('track=')[1].split('&')[0];
  const params=new URLSearchParams(location.search);
  if(params.get('track')) return params.get('track');
  return null;
}

}

function daysSince(dateStr){
  if(!dateStr) return 0;
  const d=new Date(dateStr); const now=new Date();
  const diff=Math.floor((now-d)/ (1000*60*60*24));
  return diff>=0?diff:0;
}
function compressImage(file, max=800, quality=0.6){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const canvas=document.createElement('canvas');
          let w=img.width,h=img.height;
          if(w>max||h>max){
            if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}
          }
          canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',quality));
        }catch(err){ resolve(e.target.result); }
      };
      img.onerror=()=>resolve(e.target.result);
      img.src=e.target.result;
    };
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

async function loadClientsLocal(){
  const raw=localStorage.getItem(CLIENTS_KEY);

}
async function loadOrdersLocal(){
  const raw=localStorage.getItem(ORDERS_KEY);
  if(raw){ try{ return JSON.parse(raw).map(o=>({...o, id: o.id?.startsWith('BE-') ? o.id.replace('BE-','JG-') : o.id})); }catch(e){ return []; } }
  return [];
}
async function fetchClients(){
  if(db){
    try{
      const snap=await getDocs(collection(db, "clientes"));
      const list=[]; snap.forEach(d=>list.push(d.data()));
      localStorage.setItem(CLIENTS_KEY, JSON.stringify(list));
      return list;
    }catch(e){ return await loadClientsLocal(); }
  }else{ return await loadClientsLocal(); }
}
async function fetchOrders(){
  if(db){
    try{
      const snap=await getDocs(collection(db, "pedidos"));
      let fotosMap={};
      try{
        const fotosSnap=await getDocs(collection(db, "pedidos_fotos"));
        fotosSnap.forEach(d=>{ fotosMap[d.id]=d.data().fotos||[]; });
      }catch(e){}
      const list=[]; snap.forEach(d=>{
        const data=d.data();
        data.fotos=fotosMap[data.id]||data.fotos||[];
        list.push(data);
      });
      localStorage.setItem(ORDERS_KEY, JSON.stringify(list));
      return list;
    }catch(e){ return await loadOrdersLocal(); }
  }else{ return await loadOrdersLocal(); }
}

function setupRealtime(){
  if(!db || isRealtimeActive) return;
  isRealtimeActive=true;
  try{
    // Clientes realtime
    unsubscribeClients = onSnapshot(collection(db, "clientes"), (snap)=>{
      const list=[]; snap.forEach(d=>list.push(d.data()));
      clients=list;
      localStorage.setItem(CLIENTS_KEY, JSON.stringify(list));
      // Se estiver no admin sem cliente selecionado, atualiza lista
      if(isAdminLogged() && !getTrackId() && !getClientKey()){
        const appEl=document.getElementById('app');
        if(appEl && !showNewClient && !showDelClient && !selectedClientId) renderAdmin(appEl);
      }
      // Se cliente logado, atualiza dados do cliente
      if(currentClient){
        const updated=clients.find(c=>c.id===currentClient.id);
        if(updated) currentClient=updated;
      }
    });
    // Pedidos realtime
    unsubscribeOrders = onSnapshot(collection(db, "pedidos"), async (snap)=>{
      let fotosMap={};
      try{
        const fotosSnap=await getDocs(collection(db, "pedidos_fotos"));
        fotosSnap.forEach(d=>{ fotosMap[d.id]=d.data().fotos||[]; });
      }catch(e){}
      const list=[];
      snap.forEach(d=>{
        const data=d.data();
        data.fotos=fotosMap[data.id]||data.fotos||[];
        list.push(data);
      });
      const hadNew = list.length !== orders.length || list.some(o=>!orders.find(x=>x.id===o.id && x.status===o.status));
      orders=list;
      localStorage.setItem(ORDERS_KEY, JSON.stringify(list));
      if(hadNew){
        const tid=getTrackId();
        const cKey=getClientKey();
        if(tid || cKey || isAdminLogged()){
          // Re-render current view silently
          const appEl=document.getElementById('app');
          if(appEl) render();
          if(hadNew && (cKey || tid)) showToast('🔄 Atualizado ao vivo!');
        }
      }
    });
  }catch(e){ console.log('Realtime erro', e); }
}

              <div class="mt-2 h-1 bg-white/5 rounded-full overflow-hidden"><div class="h-full bg-brazil-gradient transition-all duration-1000" style="width:${progress}%"></div></div>
              <div class="flex gap-1 mt-2 flex-wrap"><span class="text-[7px] bg-white/5 px-1.5 py-0.5 rounded-full truncate">${st.icon} ${st.desc}</span>${o.fotos?.length?`<span class="text-[7px] bg-[#009739]/20 text-[#00FF88] px-1.5 py-0.5 rounded-full">📸 ${o.fotos.length}</span>`:''}</div>
            </div>
          </div>
        </div>`;
      }).join('')}</div>`:`<div class="bg-[#0F1F15]/60 border border-white/5 rounded-[24px] p-10 text-center"><div class="text-4xl mb-3">📦</div><h3 class="font-black text-sm">Nenhum pedido ainda</h3><p class="text-xs text-white/50 mt-2">O Admin ainda não cadastrou pedidos. Quando cadastrar, aparece aqui ao vivo!</p></div>`}

      <!-- FIX #4 Copyright corrigido -->
      <div class="mt-8 bg-[#081A12] border border-[#FFDF00]/10 rounded-[20px] p-5 text-center">
        <div class="font-black tracking-widest text-[10px]">JAGUARARA IMPORTS</div>
        <div class="text-[10px] text-white/30 mt-1">© 2026 Jaguarara Imports • 100% Brasileiro • Todos os direitos reservados</div>
        <div class="text-[9px] text-white/20 mt-2">Desenvolvido com 🐆 no Brasil • Sistema V3 • Atualização ao vivo • ${client.nome} • ${cOrders.length} pedidos</div>
      </div>
    </div>
  </div>`;

  window.currentModalFotos=[];
}

    <div class="h-2 w-full bg-brazil-gradient shimmer-bar"></div>
    <div class="bg-[#081A12]/90 backdrop-blur-xl border-b border-white/5 sticky top-0 z-20">

        <div class="flex items-center gap-2 min-w-0"><div class="w-9 h-9 bg-[#FFDF00] rounded-xl flex items-center justify-center text-black font-black shrink-0">🐆</div><div class="min-w-0"><div class="font-black tracking-[0.2em] text-[10px] truncate">JAGUARARA</div><div class="text-[7px] tracking-[0.35em] text-[#FFDF00] font-bold truncate">${client?client.nome.toUpperCase():'BRASIL'} • AO VIVO 🟢</div></div></div>
        <div class="flex items-center gap-2 shrink-0">${backBtn}<div class="text-right"><div class="text-[8px] text-white/40">PEDIDO</div><div class="font-black text-[11px] text-[#FFDF00]">${order.id}</div></div></div>
      </div>
      <div class="h-1 bg-white/5"><div class="h-full bg-brazil-gradient transition-all duration-1000" style="width:${progress}%"></div></div>
    </div>
    <div class="max-w-3xl mx-auto px-4 py-6">
      <div class="bg-gradient-to-br from-[#0F2D1E] to-[#081A12] border border-[#009739]/20 rounded-[24px] p-5 mb-5">
        <div class="flex gap-3 mb-5">
          <div class="w-16 h-16 rounded-[14px] bg-black border border-white/10 overflow-hidden shrink-0">${order.capa?`<img src="${order.capa}" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center text-lg">📦</div>`}</div>
          <div class="min-w-0 flex-1"><div class="inline-flex bg-[#FFDF00]/20 border border-[#FFDF00]/30 px-2 py-0.5 rounded-full text-[8px] font-black text-[#FFDF00] mb-1.5">100% BRASILEIRO • PREMIUM • AO VIVO</div><h1 class="text-[18px] font-black leading-tight truncate">${order.nomeProduto||'Produto'}</h1><p class="text-white/50 text-[10px] mt-1 truncate">Pedido ${order.id} • ${client?.nome||order.cliente||''}</p></div>
        </div>
        <!-- FIX #3 - Valores sem imprensar -->
        <div class="grid grid-cols-3 gap-2">
          <div class="bg-[#081A12]/90 border border-white/5 rounded-[14px] p-3 min-w-0"><div class="text-[8px] text-white/40 font-black tracking-widest">PRODUTO</div><div class="font-black text-[13px] mt-1.5 truncate">${formatBRL(order.valor)}</div><div class="text-[8px] text-white/30 mt-1">Valor base</div></div>
          <div class="bg-[#081A12] border border-[#FFDF00]/20 rounded-[14px] p-3 min-w-0"><div class="text-[8px] text-[#FFDF00]/70 font-black tracking-widest">ASSESSORIA</div><div class="font-black text-[13px] mt-1.5 text-[#FFDF00] truncate">${formatBRL(com)}</div><div class="text-[8px] text-white/30 mt-1">Taxa fixa</div></div>
          <div class="bg-[#009739] rounded-[14px] p-3 min-w-0"><div class="text-[8px] text-white/70 font-black tracking-widest">TOTAL</div><div class="font-black text-[12px] mt-1.5 leading-tight">${hasFrete?`<span class="truncate block">${formatBRL(total)}</span>`:'<span class="text-[10px]">A<br>DEFINIR</span>'}</div><div class="text-[8px] text-white/70 mt-1">${hasFrete?'Final':'Aguardando'}</div></div>
        </div>
        <div class="mt-3 flex flex-wrap gap-1.5">${pesoEstStr?`<span class="bg-white/5 border border-white/10 px-2.5 py-1 rounded-full text-[10px]">📦 ${pesoEstStr} est.</span>`:''}${pesoRealStr?`<span class="bg-[#009739]/20 border border-[#009739]/30 px-2.5 py-1 rounded-full text-[10px] text-[#00FF88]">⚖️ ${pesoRealStr} real</span>`:''}${order.rastreio?`<span class="bg-[#002776]/20 border border-[#002776]/30 px-2.5 py-1 rounded-full text-[10px] text-[#7CA0FF]">📮 ${order.rastreio}</span>`:''}</div>
      </div>

      <div class="bg-[#0F1F15]/80 backdrop-blur border border-white/5 rounded-[24px] p-5 mb-5">
        <div class="flex items-center gap-2.5 mb-5"><div class="w-7 h-7 bg-[#081A12] border border-[#FFDF00]/20 rounded-full flex items-center justify-center text-[10px]">🐆</div><h2 class="font-black tracking-[0.2em] text-[10px]">LINHA DO TEMPO PREMIUM • AO VIVO</h2><div class="ml-auto w-1.5 h-1.5 bg-[#00FF88] rounded-full animate-pulse"></div></div>
        <div class="relative">
          ${STATUSES.map(s=>{
            const done=s.id<=order.status,cur=s.id===order.status,date=order.datas[s.id]||'';
            return `<div class="flex gap-3 pb-6 relative last:pb-0">
              ${s.id!==10?`<div class="absolute left-[15px] top-[36px] w-[2px] h-[calc(100%-8px)] bg-white/5"><div class="w-full bg-gradient-to-b from-[#009739] to-[#00FF88]" style="height:${done?'100%':'0%'}"></div></div>`:''}
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-[11px] shrink-0 z-10 border-2 ${done?'bg-[#009739] border-[#009739] text-white':'bg-[#081A12] border-white/10 text-white/30'} ${cur?'!bg-[#FFDF00] !border-[#FFDF00] !text-black scale-110':''}">${done?'✓':s.icon}</div>
              <div class="flex-1 -mt-0.5 min-w-0"><div class="flex justify-between gap-2"><span class="font-black text-[12px] ${done?'text-white':'text-white/30'} truncate">${s.label}</span><span class="text-[9px] bg-white/5 px-2 py-1 rounded-full border border-white/5 shrink-0">${date||'--'}</span></div><div class="text-[11px] ${done?'text-white/60':'text-white/25'} mt-0.5">${s.desc}</div>${cur?`<div class="mt-1.5 inline-flex bg-[#FFDF00] text-black text-[8px] font-black px-2 py-0.5 rounded-full animate-pulse">AGORA • AO VIVO</div>`:''}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      ${order.fotos&&order.fotos.length?`<div class="bg-[#0F1F15]/60 backdrop-blur border border-white/5 rounded-[24px] p-5 mb-5"><div class="flex items-center gap-2.5 mb-5"><div class="w-7 h-7 bg-[#FFDF00] rounded-full flex items-center justify-center text-black text-[10px]">📸</div><h2 class="font-black text-[10px] tracking-[0.2em]">FOTOS QC • ${order.fotos.length} • AO VIVO</h2><span class="ml-auto bg-white/10 text-[7px] px-2 py-1 rounded-full">👆 CLIQUE</span></div><div class="grid grid-cols-2 md:grid-cols-3 gap-3">${order.fotos.map((f,i)=>`<div onclick="window.openImageModal(${i})" class="group relative overflow-hidden rounded-[16px] border border-white/5 hover:border-[#FFDF00]/30 transition-all cursor-zoom-in"><img src="${f}" class="w-full h-40 object-cover group-hover:scale-105 transition-transform duration-500"><div class="absolute top-1.5 right-1.5 bg-black/60 w-6 h-6 rounded-full flex items-center justify-center text-[9px] opacity-0 group-hover:opacity-100">🔍</div></div>`).join('')}</div></div>`:''}

      <!-- FIX #4 Copyright corrigido -->
      <div class="bg-[#081A12] border border-[#FFDF00]/10 rounded-[20px] p-5 text-center">
        <div class="font-black tracking-[0.2em] text-[10px]">JAGUARARA IMPORTS</div>
        <div class="text-[10px] text-white/30 mt-1">© 2026 Jaguarara Imports • 100% Brasileiro • Todos os direitos reservados</div>
        <div class="text-[9px] text-white/20 mt-1">Desenvolvido com 🐆 no Brasil • V3 • Ao vivo • Atualização automática</div>
      </div>

      <div id="fotoModal" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-[#081A12]/95 backdrop-blur-xl" onclick="window.closeImageModal()"></div><div class="relative h-full flex flex-col"><div class="flex justify-between items-center p-4"><div class="font-black text-[10px]">FOTO QC • AO VIVO</div><button onclick="window.closeImageModal()" class="w-9 h-9 bg-white/10 rounded-full">✕</button></div><div class="flex-1 flex items-center justify-center p-4"><img id="fotoModalImg" src="" class="max-w-full max-h-[85vh] object-contain rounded-[16px] border border-white/10"></div><div class="p-4 flex justify-center gap-2"><button onclick="window.prevImageModal()" class="bg-white/10 px-4 py-2 rounded-full text-xs">←</button><span id="fotoCounter" class="bg-[#FFDF00] text-black px-3 py-2 rounded-full text-xs font-black">1 / 1</span><button onclick="window.nextImageModal()" class="bg-white/10 px-4 py-2 rounded-full text-xs">→</button></div></div></div>
    </div>
  </div>`;
}

window.currentModalFotos=[]; window.currentModalIndex=0;
window.openImageModal=(idx)=>{
  const fotos=window.currentModalFotos; if(!fotos||!fotos.length) return;
  window.currentModalIndex=idx;
  document.getElementById('fotoModalImg').src=fotos[idx];
  document.getElementById('fotoCounter').textContent=(idx+1)+' / '+fotos.length;
  document.getElementById('fotoModal').classList.remove('hidden');
  document.body.style.overflow='hidden';
};
window.closeImageModal=()=>{ document.getElementById('fotoModal')?.classList.add('hidden'); document.body.style.overflow=''; };
window.nextImageModal=()=>{ let i=window.currentModalIndex+1; if(i>=window.currentModalFotos.length) i=0; window.openImageModal(i); };
window.prevImageModal=()=>{ let i=window.currentModalIndex-1; if(i<0) i=window.currentModalFotos.length-1; window.openImageModal(i); };

window.switchTab=(tab)=>{
  document.getElementById('paneCliente').classList.toggle('hidden', tab!=='cliente');
  document.getElementById('paneAdmin').classList.toggle('hidden', tab!=='admin');
  document.getElementById('tabCliente').className=tab==='cliente'?'flex-1 bg-[#081A12] text-[#FFDF00] font-black py-3 rounded-full text-sm':'flex-1 text-gray-500 font-bold py-3 rounded-full text-sm';
  document.getElementById('tabAdmin').className=tab==='admin'?'flex-1 bg-[#081A12] text-[#FFDF00] font-black py-3 rounded-full text-sm':'flex-1 text-gray-500 font-bold py-3 rounded-full text-sm';
};
window.loginClient=()=>{
  const key=document.getElementById('clientKeyInput').value.trim();
  if(!key){ showToast('Digite sua Key'); return; }
  const cli=clients.find(c=>c.id===key||c.key===key);
  if(!cli){ showToast('❌ Key não encontrada'); return; }
  location.hash='client='+cli.id;
  render();
};
window.loginAdmin=()=>{
  const p=document.getElementById('loginPass').value;
  if(p===FIXED_PASSWORD){ localStorage.setItem(ADMIN_SESSION_KEY,'1'); sessionStorage.setItem(ADMIN_SESSION_KEY,'1'); render(); showToast('✅ Admin V3 liberado • Realtime ativo'); }else{ showToast('❌ Senha incorreta'); }
};
window.logout=()=>{ localStorage.removeItem(ADMIN_SESSION_KEY); sessionStorage.removeItem(ADMIN_SESSION_KEY); if(unsubscribeClients) unsubscribeClients(); if(unsubscribeOrders) unsubscribeOrders(); isRealtimeActive=false; location.hash=''; render(); };
window.logoutClient=()=>{ currentClient=null; location.hash=''; render(); };
window.clearCache=()=>{ if(confirm('Limpar cache local? Isso apaga dados temporários e recarrega do Firebase (corrige cliente fantasma)')){ localStorage.removeItem(CLIENTS_KEY); localStorage.removeItem(ORDERS_KEY); clients=[]; orders=[]; location.reload(); } };
window.openNewClient=()=>{ showNewClient=true; renderAdmin(document.getElementById('app')); setTimeout(()=>{ const el=document.getElementById('ncKeyPreview'); if(el) el.textContent=genClientKey(); },100); };
window.closeNewClient=()=>{ showNewClient=false; renderAdmin(document.getElementById('app')); };
window.createClient=async()=>{
  const nome=document.getElementById('ncNome').value.trim();
  const whats=document.getElementById('ncWhats').value.trim();
  const key=document.getElementById('ncKeyPreview').textContent.trim();
  if(!nome||!whats){ showToast('Preencha nome e whats'); return; }
  const id=key;
  const newClient={id, key, nome, whatsapp:whats, criadoEm:new Date().toISOString()};
  clients.push(newClient);
  await saveClientToDB(newClient);
  showNewClient=false;
  renderAdmin(document.getElementById('app'));
  showToast('✅ Conta criada! Key: '+key);
  setTimeout(()=>window.copyClientKey(id),500);
};
window.selClient=(id)=>{ selectedClientId=id; renderAdmin(document.getElementById('app')); };
window.backToClients=()=>{ selectedClientId=null; selectedOrderId=null; renderAdmin(document.getElementById('app')); };
window.backToClientDetail=()=>{ selectedOrderId=null; renderAdmin(document.getElementById('app')); };
window.copyClientKey=(id)=>{
  const c=clients.find(x=>x.id===id);
  const key=c?.key||c?.id||id;
  const url=location.href.split('#')[0]+'#client='+id;
  const text=`Fala ${c?.nome||''}! 🐆 Sua conta Jaguarara foi criada!%0A%0A🔑 Sua Key: ${key}%0A🔗 Seu link: ${url}%0A%0AGuarde essa Key, é com ela que você acessa todos os seus pedidos ao vivo!`;
  navigator.clipboard.writeText(decodeURIComponent(text)).then(()=>showToast('🔑 Key + link copiados!')).catch(()=>prompt('Copie:',decodeURIComponent(text)));
};
window.askDelClient=(id)=>{ showDelClient=id; renderAdmin(document.getElementById('app')); };
window.cancelDelClient=()=>{ showDelClient=null; renderAdmin(document.getElementById('app')); };
window.delClient=async(id)=>{
  const cOrders=orders.filter(o=>o.clienteId===id);
  for(let o of cOrders){ await deleteOrderFromDB(o.id); }
  orders=orders.filter(o=>o.clienteId!==id);
  clients=clients.filter(c=>c.id!==id);
  await deleteClientFromDB(id);
  showDelClient=null; selectedClientId=null;
  renderAdmin(document.getElementById('app'));
  showToast('Cliente e pedidos apagados');
};

window.openNewOrder=(clienteId)=>{
  selectedClientId=clienteId; showNewOrder=true; renderAdmin(document.getElementById('app'));
  setTimeout(()=>{
    const input=document.getElementById('noCapa');
    if(input){
      input.addEventListener('change', async (e)=>{
        const file=e.target.files[0];
        if(!file) return;
        const data=await compressImage(file,600,0.6);
        tempCapa=data;
        document.getElementById('capaPreview').classList.remove('hidden');
        document.getElementById('capaPreviewImg').src=data;
      });
    }
    const v=document.getElementById('noValor');
    if(v) v.addEventListener('input',e=>{
      const val=parseFloat(e.target.value)||0;
      const com=getCommission(val);
      document.getElementById('noComissao').innerHTML=val>0?`Valor ${formatBRL(val)} → Comissão <b>${formatBRL(com)}</b>`:'Digite valor';
    });
  },100);
};
window.closeNewOrder=()=>{ showNewOrder=false; tempCapa=null; renderAdmin(document.getElementById('app')); };
window.createOrder=async(clienteId)=>{
  const nomeProd=document.getElementById('noNomeProd').value.trim();
  const link=document.getElementById('noLink').value.trim();
  const valor=parseFloat(document.getElementById('noValor').value);
  const pesoVal=document.getElementById('noPesoVal').value.trim();
  const pesoUnit=document.getElementById('noPesoUnit').value;
  if(!nomeProd||!valor){ showToast('Nome e valor obrigatórios'); return; }
  const client=clients.find(c=>c.id===clienteId);
  const id=genId();
  const newOrder={
    id, clienteId, cliente:client?.nome||'', nomeProduto:nomeProd, capa:tempCapa||'', link, valor,
    pesoEst:{value:pesoVal,unit:pesoUnit}, status:1, pesoReal:{value:'',unit:'kg'}, frete:'', rastreio:'', fotos:[], datas:{1:new Date().toLocaleString('pt-BR')}
  };
  orders.push(newOrder);
  await saveOrderToDB(newOrder);
  showNewOrder=false; tempCapa=null; selectedOrderId=id;
  renderAdmin(document.getElementById('app'));
  showToast('✅ Pedido '+id+' criado - cliente vê ao vivo!');
};
window.selOrder=(id)=>{
  const order=orders.find(o=>o.id===id);
  if(!order) return;
  if(currentClient){
    location.hash='track='+id;
    render();
  }else if(isAdminLogged()){
    if(selectedClientId){
      selectedOrderId=id;
      renderAdmin(document.getElementById('app'));
    }else{
      location.hash='track='+id;
      render();
    }
  }else{
    location.hash='track='+id;
    render();
  }
};
window.closeOrderDetail=()=>{ selectedOrderId=null; renderAdmin(document.getElementById('app')); };
window.openOrderPage=(id)=>{ location.hash='track='+id; render(); };
window.askDelOrder=(id)=>{ showDelOrder=id; renderAdmin(document.getElementById('app')); };
window.cancelDelOrder=()=>{ showDelOrder=null; renderAdmin(document.getElementById('app')); };
window.delOrder=async(id)=>{ orders=orders.filter(o=>o.id!==id); await deleteOrderFromDB(id); showDelOrder=null; selectedOrderId=null; renderAdmin(document.getElementById('app')); showToast('Pedido apagado'); };
window.saveOrderEdit=async(id)=>{
  const o=orders.find(o=>o.id===id);
  o.valor=parseFloat(document.getElementById('editValor').value)||o.valor;
  o.pesoReal={value:document.getElementById('editPesoVal').value,unit:document.getElementById('editPesoUnit').value};
  o.frete=document.getElementById('editFrete').value;
  o.rastreio=document.getElementById('editRastreio').value;
  await updateOrderInDB(o);
  renderAdmin(document.getElementById('app'));
  showToast('💾 Salvo! Cliente vê ao vivo');
};
window.updateOrderStatus=async(id)=>{
  const ns=parseInt(document.getElementById('editStatus').value);
  const o=orders.find(o=>o.id===id);
  if(ns===o.status){ showToast('Já está nesse status'); return; }
  o.status=ns; o.datas[ns]=new Date().toLocaleString('pt-BR');
  await updateOrderInDB(o);
  renderAdmin(document.getElementById('app'));
  showToast('✅ Status atualizado ao vivo!');
};
window.upFoto=async(id)=>{
  const inp=document.getElementById('fInput');
  const o=orders.find(o=>o.id===id);
  if(!inp.files.length){ showToast('Selecione fotos'); return; }
  const files=Array.from(inp.files);
  if(files.length>4){ showToast('Máx 4 por vez'); return; }
  showToast(`📸 Comprimindo ${files.length}...`);
  const results=await Promise.all(files.map(f=>compressImage(f,800,0.5)));
  o.fotos.push(...results);
  if(o.fotos.length>8) o.fotos=o.fotos.slice(-8);
  await updateOrderInDB(o);
  inp.value='';
  renderAdmin(document.getElementById('app'));
  showToast(`✅ ${results.length} fotos ao vivo!`);
};
window.remFoto=async(id,i)=>{ const o=orders.find(o=>o.id===id); o.fotos.splice(i,1); await updateOrderInDB(o); renderAdmin(document.getElementById('app')); showToast('Foto removida'); };
window.copyLink=(id)=>{ const base=location.href.split('#')[0]; const url=base+'#track='+id; navigator.clipboard.writeText(url).then(()=>showToast('🔗 Link copiado!')); };
window.renderAdmin=renderAdmin;
window.render=render;
window.addEventListener('hashchange',render);
(async()=>{ clients=await fetchClients(); orders=await fetchOrders(); render(); })();
</script>
