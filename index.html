<div class="bg-[#FCFBF8] border-b p-6"><div class="flex justify-between"><div class="flex gap-3"><img id="dCapa" class="w-[72px] h-[72px] rounded-[16px] object-cover border hidden"><div id="dCapaPh" class="w-[72px] h-[72px] rounded-[16px] bg-[#F6F5F1] border border-dashed grid place-items-center">📦</div><div><div id="dId" class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-black text-white inline-block"></div><div id="dProd" class="font-bold text-[17px] leading-tight mt-2 max-w-[300px] break-words"></div><div id="dCli" class="text-[12px] text-zinc-500 mt-1"></div></div></div><button onclick="closeDrawer()" class="w-8 h-8 rounded-full bg-white border">✕</button></div><div class="mt-4"><button id="btnCopy" class="h-10 px-5 rounded-full bg-black text-white text-[13px] font-bold w-full">🔗 Copiar Link do Cliente</button></div></div>

<div class="grid grid-cols-2 gap-3"><div class="bg-white rounded-[14px] border p-3"><div class="text-[10px] font-bold text-zinc-400">CLIENTE</div><input id="eCli" class="mt-1 w-full bg-transparent font-medium text-[14px] outline-none"></div><div class="bg-white rounded-[14px] border p-3"><div class="text-[10px] font-bold text-zinc-400">PRODUTO</div><input id="eProd" class="mt-1 w-full bg-transparent font-medium text-[14px] outline-none"></div><div class="bg-white rounded-[14px] border p-3"><div class="text-[10px] font-bold text-zinc-400">VALOR PRODUTO R$</div><input id="eVal" type="number" inputmode="decimal" class="mt-1 w-full bg-transparent font-medium text-[14px] outline-none"></div><div class="bg-white rounded-[14px] border p-3"><div class="text-[10px] font-bold text-zinc-400">PESO REAL</div><div class="flex gap-2 mt-1"><input id="ePeso" type="number" inputmode="decimal" class="flex-1 bg-transparent font-medium text-[14px] outline-none" placeholder="380"><select id="ePesoUn" class="w-[70px] h-[32px] rounded-full bg-[#F6F5F1] border text-[12px] font-bold px-2"><option value="g">g</option><option value="kg">kg</option></select></div><div class="text-[10px] text-zinc-400 mt-1">Só preencha quando chegar no galpão</div></div><div class="bg-white rounded-[14px] border p-3"><div class="text-[10px] font-bold text-zinc-400">FRETE INTERNO CHINA ¥</div><input id="eFreteInt" type="number" inputmode="decimal" class="mt-1 w-full bg-transparent font-medium text-[14px] outline-none" placeholder="6"></div><div class="bg-white rounded-[14px] border p-3"><div class="text-[10px] font-bold text-zinc-400">FRETE CHINA-BRASIL R$ (Internacional)</div><input id="eFreteBR" type="number" inputmode="decimal" class="mt-1 w-full bg-transparent font-medium text-[14px] outline-none" placeholder="Só em Aguardando Envio"><div class="text-[10px] text-zinc-400 mt-1">Só aparece pro cliente em Aguardando Envio</div></div><div class="bg-white rounded-[14px] border p-3 col-span-2"><div class="text-[10px] font-bold text-zinc-400">RASTREIO - CÓDIGO</div><input id="eRast" type="text" class="mt-1 w-full bg-transparent font-medium text-[13px] outline-none" placeholder="JT123456"></div></div>
<div class="bg-white rounded-[16px] border p-4"><div class="flex justify-between"><div class="text-[11px] font-bold">CAPA</div><button onclick="document.getElementById('inpCapa').click()" class="text-[11px] font-bold px-3 h-7 rounded-full bg-[#F6F5F1] border">Trocar</button></div><div id="prevCapa" class="mt-3 w-[96px] h-[96px] rounded-[14px] bg-[#F6F5F1] border border-dashed grid place-items-center text-[11px] overflow-hidden">sem capa</div><input id="inpCapa" type="file" accept="image/*" class="hidden"></div>
<div class="bg-white rounded-[16px] border p-4"><div class="flex justify-between"><div class="text-[11px] font-bold">FOTOS QC (<span id="qcC">0</span>)</div><button onclick="document.getElementById('inpQc').click()" class="h-7 px-3 rounded-full bg-black text-white text-[11px] font-bold">+ Adicionar</button></div><div id="qcGrid" class="mt-3 grid grid-cols-3 gap-2"></div><div id="qcEmpty" class="mt-3 border border-dashed rounded-[14px] p-5 text-center bg-[#FBFAF7] text-[12px] text-zinc-500">Nenhuma foto</div><input id="inpQc" type="file" multiple accept="image/*" class="hidden"></div>
<button id="btnSave" class="w-full h-[50px] rounded-[16px] bg-black text-white font-bold">💾 Salvar</button>

</div>
</div>

<div id="newBg" class="fixed inset-0 bg-black/30 hidden z-40"></div>
<div id="newModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">

<div class="p-7">
<div class="flex justify-between"><div class="font-bold text-[18px]">Novo Pedido • Shenzhen</div><button onclick="closeNew()" class="w-8 h-8 rounded-full bg-[#F6F5F1] border">✕</button></div>
<div class="mt-6 space-y-4">
<div class="grid grid-cols-2 gap-3"><div><div class="text-[10px] font-bold text-zinc-400">CLIENTE</div><input id="nCli" class="mt-1 w-full h-[46px] rounded-[12px] bg-[#FBFAF7] border px-4 outline-none"></div><div><div class="text-[10px] font-bold text-zinc-400">PRODUTO</div><input id="nProd" class="mt-1 w-full h-[46px] rounded-[12px] bg-[#FBFAF7] border px-4 outline-none"></div></div>
<div><div class="text-[10px] font-bold text-zinc-400">CAPA DO PRODUTO</div><div class="mt-2 flex gap-3 items-center"><div id="nPrev" class="w-[64px] h-[64px] rounded-[14px] bg-[#F6F5F1] border border-dashed grid place-items-center text-[10px] overflow-hidden">sem capa</div><button type="button" onclick="document.getElementById('nCapaInp').click()" class="h-10 px-4 rounded-full bg-white border text-[12px] font-bold">Escolher imagem</button></div><input id="nCapaInp" type="file" accept="image/*" class="hidden"></div>
<div class="grid grid-cols-2 gap-3"><div><div class="text-[10px] font-bold text-zinc-400">VALOR DO PRODUTO R$</div><input id="nVal" type="number" inputmode="decimal" class="mt-1 w-full h-[46px] rounded-[12px] bg-[#FBFAF7] border px-4 outline-none" placeholder="45,04"></div><div><div class="text-[10px] font-bold text-zinc-400">PESO ESTIMADO (opcional)</div><div class="flex gap-2 mt-1"><input id="nPeso" type="number" inputmode="decimal" class="flex-1 h-[46px] rounded-[12px] bg-[#FBFAF7] border px-4 outline-none" placeholder="—"><select id="nPesoUn" class="w-[70px] h-[46px] rounded-[14px] bg-[#FBFAF7] border text-[12px] font-bold px-2"><option value="g" selected>g</option><option value="kg">kg</option></select></div><div class="text-[10px] text-zinc-400 mt-1">Deixe vazio, pesa só no galpão</div></div></div>
<div class="grid grid-cols-2 gap-3"><div><div class="text-[10px] font-bold text-zinc-400">FRETE INTERNO CHINA ¥</div><input id="nFreteInt" type="number" inputmode="decimal" class="mt-1 w-full h-[46px] rounded-[12px] bg-[#FBFAF7] border px-4 outline-none" placeholder="6"></div><div><div class="text-[10px] font-bold text-zinc-400">RASTREIO - CÓDIGO</div><input id="nRast" type="text" class="mt-1 w-full h-[46px] rounded-[12px] bg-[#FBFAF7] border px-4 outline-none" placeholder="JT123456"></div></div>
<button onclick="createOrder()" class="w-full h-[52px] rounded-full bg-black text-white font-bold mt-2">Criar Pedido • Pedido Confirmado</button>
</div>
</div>
</div>
</div>

<div id="delBg" class="fixed inset-0 bg-black/40 hidden z-[60]"></div>
<div id="delModal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-4"><div class="w-full max-w-[360px] bg-white rounded-[24px] border p-7 text-center"><div class="font-bold">Excluir?</div><div class="text-[13px] text-zinc-500 mt-2">Excluir <b id="delId"></b>?</div><div class="grid grid-cols-2 gap-3 mt-6"><button onclick="closeDel()" class="h-11 rounded-full border font-bold">Cancelar</button><button id="confirmDel" class="h-11 rounded-full bg-[#FF3B30] text-white font-bold">Excluir</button></div></div></div>
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white rounded-full px-5 py-3 text-[13px] z-[100]"><span id="toastMsg"></span></div>
<div id="qcFull" class="hidden fixed inset-0 z-[80] bg-black/80 flex items-center justify-center p-6"><img id="qcFullImg" class="max-w-[90vw] max-h-[85vh] rounded-[20px]"><button onclick="document.getElementById('qcFull').classList.add('hidden')" class="absolute top-6 right-6 w-10 h-10 rounded-full bg-white">✕</button></div>
`;
document.getElementById("search")?.addEventListener("input",e=>{q=e.target.value; renderAdminList();});
document.getElementById("nCapaInp")?.addEventListener("change", async e=>{let f=e.target.files[0]; if(!f) return; tempCapa=await toB64(f); document.getElementById("nPrev").innerHTML=`<img src="${tempCapa}" class="w-full h-full object-cover">`;});
renderAdminList();
}
function renderAdminList(){
let listEl=document.getElementById("list"); let emptyEl=document.getElementById("empty"); let cntEl=document.getElementById("cnt");
if(!listEl) return;
let filtered=orders.filter(o=>(o.id+" "+o.cliente+" "+o.produto).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.id.localeCompare(a.id));
if(cntEl) cntEl.textContent=filtered.length+" pedidos";
if(filtered.length===0){listEl.innerHTML=""; emptyEl.classList.remove("hidden");} else {emptyEl.classList.add("hidden");
listEl.innerHTML=filtered.map(o=>{let idx=STEPS.findIndex(s=>s.id===o.status); let pct=(idx/(STEPS.length-1))*100; return `<div onclick="openDrawer('${o.id}')" class="px-6 py-5 flex gap-4 items-center hover:bg-[#FBFAF7] cursor-pointer border-b last:border-0"><div class="w-[64px] h-[64px] rounded-[16px] bg-[#F6F5F1] border overflow-hidden grid place-items-center shrink-0">${o.capa?`<img src="${o.capa}" class="w-full h-full object-cover">`:`📦`}</div><div class="flex-1 min-w-0"><div class="flex gap-2"><span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-black text-white">${o.id}</span><span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-[#FFF7CC] border truncate max-w-[150px]">${o.status}</span></div><div class="font-bold text-[14px] truncate mt-1">${o.produto}</div><div class="text-[12px] text-zinc-500 truncate">${o.cliente} • ${o.peso?o.peso+o.pesoUn:"sem peso"}</div></div><div class="text-right"><div class="font-bold text-[13px]">${fmt(o.valor)}</div><div class="w-[80px] h-[6px] bg-[#F0EFEB] rounded-full mt-2 overflow-hidden"><div class="h-full bg-black rounded-full" style="width:${pct}%"></div></div></div></div>`;}).join("");}
}
function openNew(){document.getElementById("newBg").classList.remove("hidden"); document.getElementById("newModal").classList.remove("hidden");}
function closeNew(){document.getElementById("newBg").classList.add("hidden"); document.getElementById("newModal").classList.add("hidden");}
function createOrder(){
let cliente=document.getElementById("nCli").value.trim();
let produto=document.getElementById("nProd").value.trim();
let valor=parseFloat(document.getElementById("nVal").value)||0;
let peso=document.getElementById("nPeso").value.trim();
let pesoUn=document.getElementById("nPesoUn").value;
let freteInterno=document.getElementById("nFreteInt").value.trim();
let rastreio=document.getElementById("nRast").value.trim();
if(!cliente||!produto){toast("Preencha cliente e produto"); return;}
orders.push({id:genId(),cliente,produto,valor,peso,pesoUn,freteInterno,freteBR:"",rastreio,status:"PEDIDO CONFIRMADO",capa:tempCapa,fotos:[],criadoEm:new Date().toLocaleDateString("pt-BR")});
localStorage.setItem(KEY,JSON.stringify(orders)); closeNew(); renderAdminList(); toast("Pedido criado");
tempCapa=null; document.getElementById("nPrev").innerHTML="sem capa"; document.getElementById("nCli").value=""; document.getElementById("nProd").value=""; document.getElementById("nVal").value=""; document.getElementById("nPeso").value=""; document.getElementById("nFreteInt").value=""; document.getElementById("nRast").value="";
}
function openDrawer(id){
let o=orders.find(x=>x.id===id); if(!o) return; sel=o.id;
document.getElementById("dId").textContent=o.id;
document.getElementById("dProd").textContent=o.produto;
document.getElementById("dCli").textContent=o.cliente+" • "+o.criadoEm;
document.getElementById("eCli").value=o.cliente;
document.getElementById("eProd").value=o.produto;
document.getElementById("eVal").value=o.valor;
document.getElementById("ePeso").value=o.peso;
document.getElementById("ePesoUn").value=o.pesoUn||"g";
document.getElementById("eFreteInt").value=o.freteInterno||"";
document.getElementById("eFreteBR").value=o.freteBR||"";
document.getElementById("eRast").value=o.rastreio;
document.getElementById("selStatus").value=o.status;
if(o.capa){document.getElementById("dCapa").src=o.capa; document.getElementById("dCapa").classList.remove("hidden"); document.getElementById("dCapaPh").classList.add("hidden"); document.getElementById("prevCapa").innerHTML=`<img src="${o.capa}" class="w-full h-full object-cover">`;} else {document.getElementById("dCapa").classList.add("hidden"); document.getElementById("dCapaPh").classList.remove("hidden"); document.getElementById("prevCapa").textContent="sem capa";}
let grid=document.getElementById("qcGrid"); let empty=document.getElementById("qcEmpty"); document.getElementById("qcC").textContent=o.fotos.length;
if(o.fotos.length===0){grid.innerHTML=""; empty.classList.remove("hidden");} else {empty.classList.add("hidden"); grid.innerHTML=o.fotos.map((f,i)=>`<div class="relative aspect-square rounded-[14px] overflow-hidden border"><img src="${f}" class="w-full h-full object-cover cursor-pointer" onclick="openQcFull('${f}')"><button onclick="removeQc(${i})" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70 text-white text-[10px]">✕</button></div>`).join("");}
document.getElementById("drawerBg").classList.remove("hidden");
document.getElementById("drawer").classList.remove("hidden");
}
function closeDrawer(){document.getElementById("drawerBg").classList.add("hidden"); document.getElementById("drawer").classList.add("hidden"); sel=null;}

function renderClientPage(trackId){
let o=orders.find(x=>x.id===trackId);
let app=document.getElementById("app");
if(!o){app.innerHTML=`<div class="min-h-screen grid place-items-center p-8"><div class="bg-white rounded-[28px] border p-12 text-center">Pedido ${trackId} não encontrado</div></div>`; return;}
let idx=STEPS.findIndex(s=>s.id===o.status);
let idxChegou=STEPS.findIndex(s=>s.id.includes("CHEGOU NO GALPÃO"));
let idxAguardando=STEPS.findIndex(s=>s.id.includes("AGUARDANDO ENVIO"));
let hasWeight = idx >= idxChegou && o.peso;
let hasFreteBR = idx >= idxAguardando && o.freteBR;

let boxesHtml = '';
// Sempre mostra Valor Pago
boxesHtml += `<div class="bg-[#F6F5F1] rounded-[20px] border border-[#EDEBE6] p-5"><div class="text-[10px] font-bold tracking-[0.16em] text-zinc-400 uppercase">Valor Pago</div><div class="font-black text-[18px] mt-2">${fmt(o.valor)}</div><div class="text-[11px] text-zinc-500 mt-1">BRL</div></div>`;
// Frete Interno - sempre mostra se tiver, mas sem "Interno" na linha do valor e sem "Em breve"
if(o.freteInterno){
  boxesHtml += `<div class="bg-[#F6F5F1] rounded-[20px] border border-[#EDEBE6] p-5"><div class="text-[10px] font-bold tracking-[0.16em] text-zinc-400 uppercase">Frete Interno</div><div class="font-black text-[18px] mt-2">${fmtYen(o.freteInterno)}</div><div class="text-[11px] text-zinc-500 mt-1">China</div></div>`;
}
// Peso Real - SÓ aparece quando chegou no galpão
if(hasWeight){
  boxesHtml += `<div class="bg-[#F6F5F1] rounded-[20px] border border-[#EDEBE6] p-5"><div class="text-[10px] font-bold tracking-[0.16em] text-zinc-400 uppercase">Peso Real</div><div class="font-black text-[18px] mt-2">${o.peso}${o.pesoUn||"g"}</div><div class="text-[11px] text-zinc-500 mt-1">conferido</div></div>`;
}
// Frete Internacional - SÓ aparece quando aguardando envio
if(hasFreteBR){

function logout(){sessionStorage.removeItem("jg_auth"); location.reload();}
function openDel(id){pendingDel=id; document.getElementById("delId").textContent=id; document.getElementById("delBg").classList.remove("hidden"); document.getElementById("delModal").classList.remove("hidden");}
function closeDel(){document.getElementById("delBg").classList.add("hidden"); document.getElementById("delModal").classList.add("hidden"); pendingDel=null;}
(function(){

if(track){renderClientPage(track); return;}
if(sessionStorage.getItem("jg_auth")==="1"){renderAdminPage();} else {renderLogin();}
})();

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
