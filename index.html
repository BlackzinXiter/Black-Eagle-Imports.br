<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAGUARARA IMPORTS - Premium Final</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.font-serif{font-family:"Instrument Serif",serif}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.shimmer{position:relative;overflow:hidden}
.shimmer::after{content:"";position:absolute;top:0;left:0;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);animation:shine 2.2s infinite}
</style>
</head>
<body class="bg-[#F6F5F1]">
<div id="app"></div>

<script>
const PASS="sazgir-gaxxoh-0mIdno";
const KEY="jaguarara_final_v10";
const STEPS=[
{id:"PEDIDO CONFIRMADO",label:"PEDIDO CONFIRMADO",desc:"Seu pedido foi confirmado em nosso sistema"},
{id:"PAGAMENTO CONFIRMADO",label:"PAGAMENTO CONFIRMADO",desc:"Pagamento confirmado ao fornecedor na China"},
{id:"ENVIADO PARA GALPÃO - SHENZHEN",label:"ENVIADO PARA GALPÃO",sub:"SHENZHEN, GUANGDONG",desc:"Fornecedor enviou para nosso galpão"},
{id:"CHEGOU NO GALPÃO - SHENZHEN, GUANGDONG",label:"CHEGOU NO GALPÃO",sub:"SHENZHEN, GUANGDONG, CHINA",desc:"Chegou no galpão Shenzhen - Peso e medidas conferidos"},
{id:"INSPEÇÃO QC",label:"INSPEÇÃO QC",desc:"Fotos reais sendo tiradas • Conferência de autenticidade"},
{id:"ARMAZENADO NO GALPÃO",label:"ARMAZENADO NO GALPÃO",desc:"Armazenado com segurança em Shenzhen"},
{id:"AGUARDANDO ENVIO / PAGAMENTO FRETE",label:"AGUARDANDO ENVIO",sub:"PAGAMENTO FRETE CHINA-BRASIL",desc:"Aguardando liberação do frete China-Brasil"},
{id:"ENVIADO AO BRASIL",label:"ENVIADO AO BRASIL",desc:"Despachado de Shenzhen rumo ao Brasil"},
{id:"EM TRÂNSITO INTERNACIONAL",label:"EM TRÂNSITO INTERNACIONAL",desc:"Em trânsito China → Brasil • Rastreio ativo"},
{id:"ENTREGUE",label:"ENTREGUE",desc:"Entregue ao cliente • Operação finalizada"}
];

let orders=[];
try{let r=localStorage.getItem(KEY); if(r) orders=JSON.parse(r);}catch(e){orders=[]}
let sel=null; let tempCapa=null; let q=""; let pendingDel=null;

const save=()=>{localStorage.setItem(KEY,JSON.stringify(orders)); renderAdmin();}
const genId=()=>"JG-"+Math.floor(1000+Math.random()*9000);
const fmt=(n)=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const toast=(m)=>{let t=document.getElementById("toast");document.getElementById("toastMsg").textContent=m; t.classList.remove("hidden"); setTimeout(()=>t.classList.add("hidden"),2600); }
const toB64=(f)=>new Promise(r=>{let fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f);});

function isTrack(){return new URLSearchParams(location.search).get("track");}

function renderLogin(){
document.getElementById("app").innerHTML=`
<div class="min-h-screen flex items-center justify-center p-5 bg-[#0A0A0A] relative overflow-hidden">
<div class="absolute top-[-15%] left-[-10%] w-[700px] h-[700px] bg-[#009739]/15 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-15%] right-[-5%] w-[600px] h-[600px] bg-[#FFD60A]/20 rounded-full blur-[120px]"></div>
<div class="w-full max-w-[420px] bg-white rounded-[32px] border border-white/20 shadow-[0_24px_80px_rgba(0,0,0,0.4)] relative z-10 overflow-hidden">
<div class="h-[4px] bg-gradient-to-r from-[#009739] via-[#FFD60A] to-[#002776]"></div>
<div class="p-10">
<div class="w-12 h-12 rounded-[16px] bg-black text-white grid place-items-center text-[22px]">🐆</div>
<h1 class="font-serif text-[36px] leading-[0.9] tracking-[-0.03em] mt-6">Jaguarara<br>Imports</h1>
<p class="text-[12px] tracking-[0.16em] text-zinc-400 font-bold mt-2 uppercase">Galpão Shenzhen • Premium</p>
<input id="pw" type="password" placeholder="Senha admin" class="mt-8 w-full h-[56px] rounded-full bg-[#F6F5F1] border border-[#EDEBE6] px-6 outline-none focus:border-black focus:bg-white">
<button id="btnLogin" class="mt-4 w-full h-[56px] rounded-full bg-black text-white font-bold">Entrar no Galpão →</button>
</div>
</div>
</div>`;
document.getElementById("btnLogin").onclick=()=>{
if(document.getElementById("pw").value===PASS){sessionStorage.setItem("jg_auth","1"); renderAdminPage();} else toast("Senha incorreta");
};
}

function renderAdminPage(){
const track=isTrack();
if(track){ renderClient(track); return; }
if(sessionStorage.getItem("jg_auth")!=="1"){ renderLogin(); return; }
renderAdmin();
}

function renderAdmin(){
let app=document.getElementById("app");
if(!app) return;
let filtered=orders.filter(o=>(o.id+" "+o.cliente+" "+o.produto).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.id.localeCompare(a.id));
let total=orders.length;
let fat=orders.reduce((a,b)=>a+(+b.valor||0),0);
app.innerHTML=`
<header class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b border-[#EDEBE6]">
<div class="max-w-[1280px] mx-auto px-6 h-[70px] flex items-center justify-between">
<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-[12px] bg-black text-white grid place-items-center">🐆</div><div class="font-black text-[14px] leading-none">JAGUARARA<br><span class="text-[10px] tracking-[0.2em] font-bold text-zinc-400">IMPORTS • SHENZHEN</span></div></div>
<div class="flex gap-2"><button onclick="openNew()" class="h-10 px-5 rounded-full bg-black text-white text-[13px] font-bold">+ Novo Pedido</button><button onclick="logout()" class="h-10 w-10 rounded-full border bg-white">↗</button></div>
</div>
<div class="h-[3px] bg-gradient-to-r from-[#009739] via-[#FFD60A] to-[#002776]"></div>
</header>
<main class="max-w-[1280px] mx-auto p-6">
<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
<div class="bg-white rounded-[22px] border border-[#EDEBE6] p-5 shadow-sm"><div class="text-[10px] font-bold tracking-widest text-zinc-400">TOTAL PEDIDOS</div><div class="font-serif text-[36px] leading-none mt-3">${total}</div><div class="text-[12px] text-zinc-500 mt-1">ativos</div></div>
<div class="bg-white rounded-[22px] border border-[#EDEBE6] p-5 shadow-sm"><div class="text-[10px] font-bold tracking-widest text-zinc-400">FATURAMENTO</div><div class="font-serif text-[28px] leading-none mt-3 truncate">${fmt(fat)}</div><div class="text-[12px] text-zinc-500 mt-1">estimado</div></div>
<div class="bg-white rounded-[22px] border border-[#EDEBE6] p-5 shadow-sm"><div class="text-[10px] font-bold tracking-widest text-zinc-400">NO GALPÃO</div><div class="font-serif text-[36px] leading-none mt-3">${orders.filter(o=>!["ENTREGUE"].includes(o.status)).length}</div><div class="text-[12px] text-zinc-500 mt-1">Shenzhen • QC</div></div>
<div class="bg-black rounded-[22px] p-5 text-white shadow-xl"><div class="text-[10px] font-bold tracking-widest text-white/50">ENVIADOS</div><div class="font-serif text-[36px] leading-none mt-3">${orders.filter(o=>["ENVIADO AO BRASIL","EM TRÂNSITO INTERNACIONAL","ENTREGUE"].includes(o.status)).length}</div><div class="text-[12px] text-white/60 mt-1">em trânsito</div></div>
</div>

<input id="search" placeholder="Buscar JG-, cliente, produto..." value="${q}" class="mt-6 w-full h-[48px] rounded-full bg-white border border-[#EDEBE6] px-6 text-[14px] outline-none">

<div class="mt-6 bg-white rounded-[28px] border border-[#EDEBE6] shadow-[0_12px_40px_rgba(0,0,0,0.06)] overflow-hidden">
<div class="px-6 h-[60px] flex items-center justify-between border-b"><span class="font-bold text-[12px] tracking-widest">PEDIDOS • SHENZHEN</span><span class="text-[11px] bg-[#F6F5F1] border px-3 py-1 rounded-full">${filtered.length} pedidos</span></div>
<div id="list">
${filtered.length===0?`<div class="py-20 text-center"><div class="text-[20px]">📦</div><div class="font-bold mt-3">Nenhum pedido ainda</div><div class="text-[12px] text-zinc-500 mt-1">Clique em + Novo Pedido</div></div>`:
filtered.map(o=>{
let idx=STEPS.findIndex(s=>s.id===o.status);
let pct=(idx/(STEPS.length-1))*100;
return `<div onclick="openDrawer('${o.id}')" class="px-6 py-5 flex gap-4 items-center hover:bg-[#FBFAF7] cursor-pointer border-b border-[#F6F5F1] last:border-0">
<div class="w-[64px] h-[64px] rounded-[16px] bg-[#F6F5F1] border overflow-hidden grid place-items-center shrink-0">${o.capa?`<img src="${o.capa}" class="w-full h-full object-cover">`:`📦`}</div>
<div class="flex-1 min-w-0"><div class="flex gap-2"><span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-black text-white">${o.id}</span><span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-[#FFF7CC] border">${o.status}</span></div><div class="font-bold text-[14px] truncate mt-1">${o.produto}</div><div class="text-[12px] text-zinc-500 truncate">${o.cliente} • ${o.peso||""} • R$ ${o.valor||0}</div></div>
<div class="text-right"><div class="font-bold text-[13px]">${fmt(o.valor)}</div><div class="w-[80px] h-[6px] bg-[#F0EFEB] rounded-full mt-2 overflow-hidden"><div class="h-full bg-black rounded-full" style="width:${pct}%"></div></div></div>
</div>`;
}).join("")}
</div>
</div>
</main>

<!-- Drawer -->
<div id="drawerBg" class="fixed inset-0 bg-black/20 backdrop-blur-sm hidden z-40"></div>
<div id="drawer" class="fixed top-0 right-0 h-full w-full max-w-[560px] bg-[#FCFBF8] border-l border-[#EDEBE6] shadow-[-20px_0_80px_rgba(0,0,0,0.2)] hidden z-50 overflow-y-auto">
<div class="sticky top-0 bg-[#FCFBF8]/90 backdrop-blur-xl border-b p-6">
<div class="flex justify-between"><div class="flex gap-3"><img id="dCapa" class="w-[72px] h-[72px] rounded-[16px] object-cover border hidden"><div id="dCapaPh" class="w-[72px] h-[72px] rounded-[16px] bg-[#F6F5F1] border border-dashed grid place-items-center">📦</div><div><div id="dId" class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-black text-white inline-block"></div><div id="dProd" class="font-bold text-[18px] leading-tight mt-2 max-w-[300px]"></div><div id="dCli" class="text-[13px] text-zinc-500 mt-1"></div></div></div><button onclick="closeDrawer()" class="w-8 h-8 rounded-full bg-white border">✕</button></div>
<div class="flex gap-2 mt-4"><button id="btnCopy" class="h-9 px-4 rounded-full bg-black text-white text-[12px] font-bold">🔗 Link Cliente</button><button id="btnView" class="h-9 px-4 rounded-full bg-white border text-[12px] font-bold">Ver como Cliente</button><button id="btnZap" class="h-9 px-4 rounded-full bg-[#25D366] text-white text-[12px] font-bold">WhatsApp</button></div>
</div>
<div class="p-6 space-y-5">
<div class="bg-black text-white rounded-[20px] p-5 relative overflow-hidden"><div class="absolute top-0 right-0 w-[200px] h-[200px] bg-[#009739]/20 rounded-full blur-[40px]"></div><div class="relative"><div class="text-[10px] tracking-widest text-white/50 font-bold">STATUS ATUAL • ESCOLHA LIVRE</div><select id="selStatus" class="mt-3 w-full h-[52px] rounded-[14px] bg-white text-black px-4 font-bold text-[13px] outline-none">${STEPS.map(s=>`<option value="${s.id}">${s.label}</option>`).join("")}</select><div class="text-[11px] text-white/60 mt-3">Clique em qualquer etapa da timeline abaixo pra pular direto. Não precisa seguir ordem.</div></div></div>

<div class="grid grid-cols-2 gap-3">
<div class="bg-white rounded-[16px] border p-4"><div class="text-[10px] font-bold tracking-widest text-zinc-400">CLIENTE</div><input id="eCli" class="mt-2 w-full bg-transparent font-medium text-[14px] outline-none"></div>
<div class="bg-white rounded-[16px] border p-4"><div class="text-[10px] font-bold tracking-widest text-zinc-400">PRODUTO</div><input id="eProd" class="mt-2 w-full bg-transparent font-medium text-[14px] outline-none"></div>
<div class="bg-white rounded-[16px] border p-4"><div class="text-[10px] font-bold tracking-widest text-zinc-400">VALOR R$</div><input id="eVal" type="number" class="mt-2 w-full bg-transparent font-medium text-[14px] outline-none"></div>
<div class="bg-white rounded-[16px] border p-4"><div class="text-[10px] font-bold tracking-widest text-zinc-400">PESO</div><input id="ePeso" class="mt-2 w-full bg-transparent font-medium text-[14px] outline-none" placeholder="Ex: 235g"></div>
<div class="bg-white rounded-[16px] border p-4"><div class="text-[10px] font-bold tracking-widest text-zinc-400">FRETE CHINA-BRASIL</div><input id="eFrete" class="mt-2 w-full bg-transparent font-medium text-[14px] outline-none"></div>
<div class="bg-white rounded-[16px] border p-4"><div class="text-[10px] font-bold tracking-widest text-zinc-400">RASTREIO</div><input id="eRast" class="mt-2 w-full bg-transparent font-medium text-[13px] outline-none"></div>
</div>

<div class="bg-white rounded-[20px] border p-5"><div class="flex justify-between items-center"><div class="text-[11px] font-bold tracking-widest text-zinc-400">CAPA DO PRODUTO</div><button onclick="document.getElementById('inpCapa').click()" class="text-[11px] font-bold px-3 h-7 rounded-full bg-[#F6F5F1] border">Trocar capa</button></div><div id="prevCapa" class="mt-4 w-[96px] h-[96px] rounded-[16px] bg-[#F6F5F1] border border-dashed grid place-items-center text-[11px] text-zinc-500 overflow-hidden">sem capa</div><input id="inpCapa" type="file" accept="image/*" class="hidden"></div>

<div class="bg-white rounded-[20px] border p-5"><div class="text-[11px] font-bold tracking-widest text-zinc-400">TIMELINE VERTICAL • PREMIUM</div><div id="vTime" class="mt-6"></div></div>

<div class="bg-white rounded-[20px] border p-5"><div class="flex justify-between"><div class="text-[11px] font-bold tracking-widest text-zinc-400">FOTOS QC (<span id="qcC">0</span>)</div><button onclick="document.getElementById('inpQc').click()" class="h-8 px-4 rounded-full bg-black text-white text-[12px] font-bold">+ Adicionar</button></div><div id="qcGrid" class="mt-4 grid grid-cols-3 gap-2"></div><div id="qcEmpty" class="mt-4 border border-dashed rounded-[16px] p-6 text-center bg-[#FBFAF7] text-[12px] text-zinc-500">Nenhuma foto ainda</div><input id="inpQc" type="file" multiple accept="image/*" class="hidden"></div>

<button id="btnSave" class="w-full h-[52px] rounded-[16px] bg-black text-white font-bold">💾 Salvar alterações • Ao vivo</button>
<button id="btnDel" class="w-full h-[48px] rounded-full border border-red-200 text-red-500 font-bold text-[13px]">🗑️ Excluir pedido</button>
</div>
</div>

<!-- New Modal -->
<div id="newBg" class="fixed inset-0 bg-black/30 backdrop-blur-sm hidden z-40"></div>
<div id="newModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
<div class="w-full max-w-[520px] bg-white rounded-[28px] border shadow-[0_24px_80px_rgba(0,0,0,0.2)] overflow-hidden max-h-[90vh] overflow-y-auto">
<div class="h-[4px] bg-gradient-to-r from-[#009739] via-[#FFD60A] to-[#002776]"></div>
<div class="p-7">
<div class="flex justify-between items-center"><div class="font-bold text-[18px]">Novo Pedido • Shenzhen</div><button onclick="closeNew()" class="w-8 h-8 rounded-full bg-[#F6F5F1] border">✕</button></div>
<div class="mt-6 space-y-4">
<div class="grid grid-cols-2 gap-3"><div><div class="text-[10px] font-bold tracking-widest text-zinc-400">CLIENTE</div><input id="nCli" class="mt-2 w-full h-[46px] rounded-[14px] bg-[#FBFAF7] border border-[#EDEBE6] px-4 outline-none"></div><div><div class="text-[10px] font-bold tracking-widest text-zinc-400">PRODUTO</div><input id="nProd" class="mt-2 w-full h-[46px] rounded-[14px] bg-[#FBFAF7] border border-[#EDEBE6] px-4 outline-none"></div></div>
<div><div class="text-[10px] font-bold tracking-widest text-zinc-400">CAPA</div><div class="mt-2 flex gap-3 items-center"><div id="nPrev" class="w-[64px] h-[64px] rounded-[14px] bg-[#F6F5F1] border border-dashed grid place-items-center text-[10px] overflow-hidden">sem capa</div><button onclick="document.getElementById('nCapaInp').click()" class="h-10 px-4 rounded-full bg-white border text-[12px] font-bold">Escolher imagem</button></div><input id="nCapaInp" type="file" accept="image/*" class="hidden"></div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div><div class="text-[10px] font-bold tracking-widest text-zinc-400">VALOR R$</div><input id="nVal" type="number" class="mt-2 w-full h-[46px] rounded-[14px] bg-[#FBFAF7] border px-4 outline-none"></div><div><div class="text-[10px] font-bold tracking-widest text-zinc-400">PESO</div><input id="nPeso" class="mt-2 w-full h-[46px] rounded-[14px] bg-[#FBFAF7] border px-4 outline-none" placeholder="235g"></div><div><div class="text-[10px] font-bold tracking-widest text-zinc-400">FRETE R$</div><input id="nFrete" type="number" class="mt-2 w-full h-[46px] rounded-[14px] bg-[#FBFAF7] border px-4 outline-none"></div></div>
<div><div class="text-[10px] font-bold tracking-widest text-zinc-400">RASTREIO</div><input id="nRast" class="mt-2 w-full h-[46px] rounded-[14px] bg-[#FBFAF7] border px-4 outline-none" placeholder="https://"></div>
<button onclick="createOrder()" class="w-full h-[52px] rounded-full bg-black text-white font-bold mt-2">Criar Pedido • Status Pedido Confirmado</button>
</div>
</div>
</div>
</div>

<!-- Delete modal -->
<div id="delBg" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-[60]"></div>
<div id="delModal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-4"><div class="w-full max-w-[360px] bg-white rounded-[24px] border p-7 text-center"><div class="w-12 h-12 rounded-full bg-red-50 border border-red-100 grid place-items-center mx-auto">🗑️</div><div class="font-bold mt-4">Excluir pedido?</div><div class="text-[13px] text-zinc-500 mt-2">Tem certeza que deseja excluir <b id="delId"></b>? Ação irreversível.</div><div class="grid grid-cols-2 gap-3 mt-6"><button onclick="closeDel()" class="h-11 rounded-full border font-bold text-[13px]">Cancelar</button><button id="confirmDel" class="h-11 rounded-full bg-[#FF3B30] text-white font-bold text-[13px]">Excluir</button></div></div></div>

<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white rounded-full px-5 py-3 text-[13px] font-medium shadow-xl z-[100]"><span id="toastMsg"></span></div>
<div id="qcFull" class="hidden fixed inset-0 z-[80] bg-black/80 backdrop-blur flex items-center justify-center p-6"><img id="qcFullImg" class="max-w-[90vw] max-h-[85vh] rounded-[20px]"><button onclick="document.getElementById('qcFull').classList.add('hidden')" class="absolute top-6 right-6 w-10 h-10 rounded-full bg-white">✕</button></div>
`;

document.getElementById("search").addEventListener("input",e=>{q=e.target.value; renderAdmin();});

function openNew(){document.getElementById("newBg").classList.remove("hidden"); document.getElementById("newModal").classList.remove("hidden");}
function closeNew(){document.getElementById("newBg").classList.add("hidden"); document.getElementById("newModal").classList.add("hidden"); document.getElementById("nCli").value=""; document.getElementById("nProd").value=""; document.getElementById("nVal").value=""; document.getElementById("nPeso").value=""; document.getElementById("nFrete").value=""; document.getElementById("nRast").value=""; tempCapa=null; document.getElementById("nPrev").innerHTML="sem capa";}
document.getElementById("newBg").onclick=closeNew;
document.getElementById("nCapaInp").addEventListener("change", async e=>{let f=e.target.files[0]; if(!f) return; tempCapa=await toB64(f); document.getElementById("nPrev").innerHTML=`<img src="${tempCapa}" class="w-full h-full object-cover">`;});

function createOrder(){
let cliente=document.getElementById("nCli").value.trim();
let produto=document.getElementById("nProd").value.trim();
let valor=parseFloat(document.getElementById("nVal").value)||0;
let peso=document.getElementById("nPeso").value.trim();
let frete=document.getElementById("nFrete").value.trim();
let rastreio=document.getElementById("nRast").value.trim();
if(!cliente||!produto){ toast("Preencha cliente e produto"); return; }
orders.push({id:genId(),cliente,produto,valor,peso,frete,rastreio,status:"PEDIDO CONFIRMADO",capa:tempCapa,fotos:[],criadoEm:new Date().toLocaleDateString("pt-BR")});
save(); closeNew(); toast("Pedido criado • Pedido Confirmado");
}

window.openNew=openNew; window.closeNew=closeNew; window.createOrder=createOrder;

function openDrawer(id){
let o=orders.find(x=>x.id===id); if(!o) return;
sel=o.id;
document.getElementById("dId").textContent=o.id;
document.getElementById("dProd").textContent=o.produto;
document.getElementById("dCli").textContent=o.cliente+" • "+o.criadoEm;
document.getElementById("eCli").value=o.cliente;
document.getElementById("eProd").value=o.produto;
document.getElementById("eVal").value=o.valor;
document.getElementById("ePeso").value=o.peso;
document.getElementById("eFrete").value=o.frete;
document.getElementById("eRast").value=o.rastreio;
document.getElementById("selStatus").value=o.status;
if(o.capa){document.getElementById("dCapa").src=o.capa; document.getElementById("dCapa").classList.remove("hidden"); document.getElementById("dCapaPh").classList.add("hidden"); document.getElementById("prevCapa").innerHTML=`<img src="${o.capa}" class="w-full h-full object-cover">`;} else {document.getElementById("dCapa").classList.add("hidden"); document.getElementById("dCapaPh").classList.remove("hidden"); document.getElementById("prevCapa").textContent="sem capa";}
renderVTime(o); renderQc(o);
document.getElementById("drawerBg").classList.remove("hidden");
document.getElementById("drawer").classList.remove("hidden");
}
function closeDrawer(){document.getElementById("drawerBg").classList.add("hidden"); document.getElementById("drawer").classList.add("hidden"); sel=null;}
document.getElementById("drawerBg").onclick=closeDrawer;

function renderVTime(o){
let idx=STEPS.findIndex(s=>s.id===o.status);
let el=document.getElementById("vTime");
el.innerHTML=STEPS.map((s,i)=>{
let done=i<=idx; let curr=i===idx;
return `<div class="flex gap-4 cursor-pointer group" onclick="setStatus('${s.id}')">
<div class="flex flex-col items-center"><div class="w-[32px] h-[32px] rounded-full border-2 flex items-center justify-center text-[12px] font-bold ${done?'bg-black border-black text-white':'bg-white border-[#EDEBE6] text-zinc-300 group-hover:border-black'} ${curr?'ring-4 ring-[#FFD60A]/30 animate-pulse':''}">${done?'✓':''}</div>${i<STEPS.length-1?`<div class="w-[2px] flex-1 mt-2 ${i<idx?'bg-black':'bg-[#F0EFEB]'} min-h-[28px]"></div>`:''}</div>
<div class="flex-1 pb-8 -mt-1"><div class="flex gap-2 items-center flex-wrap"><span class="font-bold text-[13px] ${curr?'text-black':done?'text-black':'text-zinc-400'}">${s.label}</span>${curr?'<span class="text-[9px] font-black px-2 py-0.5 rounded-full bg-[#FFD60A]">AGORA • AO VIVO</span>':''}</div>${s.sub?`<div class="text-[10px] text-zinc-400 tracking-wide mt-0.5">${s.sub}</div>`:''}<div class="text-[12px] text-zinc-500 mt-1 leading-[1.4]">${s.desc}</div></div>
</div>`;
}).join("");
}

function renderQc(o){
let grid=document.getElementById("qcGrid"); let empty=document.getElementById("qcEmpty"); document.getElementById("qcC").textContent=o.fotos.length;
if(o.fotos.length===0){grid.innerHTML=""; empty.classList.remove("hidden");} else {empty.classList.add("hidden"); grid.innerHTML=o.fotos.map((f,i)=>`<div class="relative group aspect-square rounded-[14px] overflow-hidden border bg-[#F6F5F1]"><img src="${f}" class="w-full h-full object-cover cursor-pointer" onclick="openQcFull('${f}')"><button onclick="removeQc(${i})" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70 text-white text-[10px] opacity-0 group-hover:opacity-100">✕</button></div>`).join("");}
}

window.openDrawer=openDrawer;
window.closeDrawer=closeDrawer;

function setStatus(s){
let o=orders.find(x=>x.id===sel); if(!o) return; o.status=s; save(); renderVTime(o); renderAdmin(); toast("Status → "+s);
}
window.setStatus=setStatus;

document.getElementById("selStatus").addEventListener("change",e=>setStatus(e.target.value));

document.getElementById("btnSave").onclick=()=>{
let o=orders.find(x=>x.id===sel); if(!o) return;
o.cliente=document.getElementById("eCli").value.trim()||o.cliente;
o.produto=document.getElementById("eProd").value.trim()||o.produto;
o.valor=parseFloat(document.getElementById("eVal").value)||o.valor;
o.peso=document.getElementById("ePeso").value.trim();
o.frete=document.getElementById("eFrete").value.trim();
o.rastreio=document.getElementById("eRast").value.trim();
if(tempEditCapa) o.capa=tempEditCapa;
save(); toast("Salvo • Ao vivo");
};

let tempEditCapa=null;
document.getElementById("inpCapa").addEventListener("change", async e=>{let f=e.target.files[0]; if(!f) return; tempEditCapa=await toB64(f); document.getElementById("prevCapa").innerHTML=`<img src="${tempEditCapa}" class="w-full h-full object-cover">`; document.getElementById("dCapa").src=tempEditCapa; document.getElementById("dCapa").classList.remove("hidden"); document.getElementById("dCapaPh").classList.add("hidden");});

document.getElementById("inpQc").addEventListener("change", async e=>{
let o=orders.find(x=>x.id===sel); if(!o) return;
for(let f of e.target.files){o.fotos.push(await toB64(f));}
save(); renderQc(o); e.target.value="";
});
window.removeQc=(i)=>{let o=orders.find(x=>x.id===sel); o.fotos.splice(i,1); save(); renderQc(o);};

document.getElementById("btnCopy").onclick=()=>{let url=location.origin+location.pathname+"?track="+sel; navigator.clipboard.writeText(url); toast("Link copiado");};
document.getElementById("btnView").onclick=()=>{window.open(location.origin+location.pathname+"?track="+sel,"_blank");};
document.getElementById("btnZap").onclick=()=>{
let o=orders.find(x=>x.id===sel); let url=location.origin+location.pathname+"?track="+sel; let txt=`🐆 JAGUARARA IMPORTS\nOlá ${o.cliente}! Pedido ${o.id} - ${o.produto} está em ${o.status}\n${url}`; window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
};

function openDel(id){pendingDel=id; document.getElementById("delId").textContent=id; document.getElementById("delBg").classList.remove("hidden"); document.getElementById("delModal").classList.remove("hidden");}
function closeDel(){document.getElementById("delBg").classList.add("hidden"); document.getElementById("delModal").classList.add("hidden"); pendingDel=null;}
window.openDel=openDel; window.closeDel=closeDel;
document.getElementById("btnDel").onclick=()=>openDel(sel);
document.getElementById("delBg").onclick=closeDel;
document.getElementById("confirmDel").onclick=()=>{if(!pendingDel) return; orders=orders.filter(x=>x.id!==pendingDel); save(); closeDel(); closeDrawer(); toast("Excluído");};
window.closeDel=closeDel;

window.openQcFull=(src)=>{document.getElementById("qcFullImg").src=src; document.getElementById("qcFull").classList.remove("hidden");};
document.getElementById("qcFull").onclick=()=>document.getElementById("qcFull").classList.add("hidden");

function renderClient(trackId){
let o=orders.find(x=>x.id===trackId);
let app=document.getElementById("app");
if(!o){app.innerHTML=`<div class="min-h-screen grid place-items-center p-8"><div class="bg-white rounded-[28px] border p-12 text-center max-w-[400px]"><div class="text-[40px]">🔍</div><div class="font-bold mt-4">Pedido ${trackId} não encontrado</div></div></div>`; return;}
let idx=STEPS.findIndex(s=>s.id===o.status);
app.innerHTML=`
<div class="min-h-screen bg-[#F6F5F1] py-6 px-4">
<div class="max-w-[720px] mx-auto">
<div class="flex justify-between items-center mb-6"><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-[12px] bg-black text-white grid place-items-center">🐆</div><div class="font-black text-[13px] leading-none">JAGUARARA<br>IMPORTS</div></div><div class="text-[11px] px-3 py-1 rounded-full bg-black text-white font-bold">PREMIUM • SHENZHEN</div></div>

<div class="bg-white rounded-[32px] border border-[#EDEBE6] shadow-[0_16px_48px_rgba(0,0,0,0.08)] overflow-hidden">
<div class="h-[4px] bg-gradient-to-r from-[#009739] via-[#FFD60A] to-[#002776]"></div>
<div class="p-6 md:p-8">
<!-- CLIENTE NOME GRANDE APARENTE -->
<div class="flex items-center gap-3 mb-5">
<div class="w-12 h-12 rounded-full bg-black text-white grid place-items-center font-bold text-[16px]">${o.cliente[0]?.toUpperCase()||"C"}</div>
<div><div class="text-[11px] tracking-[0.16em] text-zinc-400 font-bold uppercase">Cliente</div><div class="font-black text-[20px] leading-none tracking-[-0.02em] mt-1">Olá, ${o.cliente} 👋</div><div class="text-[12px] text-zinc-500 mt-1">Seu pedido está sendo cuidado no galpão Shenzhen, Guangdong, China</div></div>
<div class="ml-auto hidden md:block text-[11px] px-3 py-1.5 rounded-full bg-[#F6F5F1] border font-bold">${o.id} • ${o.criadoEm}</div>
</div>

<div class="w-full aspect-[4/3] rounded-[24px] overflow-hidden bg-[#F6F5F1] border border-[#EDEBE6]">${o.capa?`<img src="${o.capa}" class="w-full h-full object-cover">`:`<div class="w-full h-full grid place-items-center text-[40px]">📦</div>`}</div>

<div class="mt-5"><div class="font-black text-[22px] leading-[1.15] tracking-[-0.02em] break-words">${o.produto}</div><div class="text-[13px] text-zinc-500 mt-2">ID ${o.id} • ${o.criadoEm} • Galpão Shenzhen, Guangdong, China</div></div>

<!-- 3 CAIXINHAS IGUAIS: VALOR / PESO / FRETE - COMO ANTES -->
<div class="mt-6 grid grid-cols-3 gap-3">
<div class="bg-[#F6F5F1] rounded-[18px] border border-[#EDEBE6] p-4"><div class="text-[10px] font-bold tracking-[0.16em] text-zinc-400 uppercase">Valor Pago</div><div class="font-black text-[16px] mt-2">${fmt(o.valor)}</div><div class="text-[11px] text-zinc-500 mt-1">BRL • à vista</div></div>
<div class="bg-[#F6F5F1] rounded-[18px] border border-[#EDEBE6] p-4 relative overflow-hidden"><div class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-[#009739] animate-pulse"></div><div class="text-[10px] font-bold tracking-[0.16em] text-zinc-400 uppercase">Peso Real</div><div class="font-black text-[16px] mt-2">${o.peso||"—"}</div><div class="text-[11px] text-zinc-500 mt-1">conferido no galpão</div></div>
<div class="bg-[#0A0A0A] rounded-[18px] p-4 text-white"><div class="text-[10px] font-bold tracking-[0.16em] text-white/50 uppercase">Frete China-Brasil</div><div class="font-bold text-[14px] mt-2 truncate">${o.frete||"A calcular"}</div><div class="text-[11px] text-white/60 mt-1">${o.rastreio?`Rastreio ativo`:`Em breve`}</div></div>
</div>

<!-- TIMELINE VERTICAL APENAS - 10 STATUS -->
<div class="mt-8">
<div class="flex items-center justify-between"><div class="text-[11px] font-black tracking-[0.16em] uppercase">Progressão do seu pedido • Vertical</div><div class="text-[11px] px-2.5 py-1 rounded-full bg-[#F6F5F1] border font-bold">${idx+1} de ${STEPS.length} • ${o.status}</div></div>
<div class="mt-6 relative">
<div class="absolute left-[15px] top-2 bottom-2 w-[2px] bg-[#F0EFEB]"></div>
<div class="absolute left-[15px] top-2 w-[2px] bg-black transition-all duration-700" style="height:${(idx/(STEPS.length-1))*100}%"></div>
<div class="space-y-0">
${STEPS.map((s,i)=>{
let done=i<=idx; let curr=i===idx;
return `<div class="flex gap-4 group">
<div class="flex flex-col items-center"><div class="w-[32px] h-[32px] rounded-full border-2 grid place-items-center text-[12px] font-bold ${done?'bg-black border-black text-white':'bg-white border-[#EDEBE6] text-zinc-300'} ${curr?'ring-4 ring-[#FFD60A]/30 animate-pulse shadow-[0_0_0_8px_rgba(255,214,10,0.15)]':''}">${done?'✓':''}</div>${i<STEPS.length-1?`<div class="w-[2px] flex-1 mt-2 ${i<idx?'bg-black':'bg-[#F0EFEB]'} min-h-[32px]"></div>`:''}</div>
<div class="flex-1 pb-8 -mt-1"><div class="flex gap-2 items-center flex-wrap"><span class="font-bold text-[13px] ${curr?'text-black':done?'text-black':'text-zinc-400'}">${s.label}</span>${curr?'<span class="text-[9px] font-black px-2 py-0.5 rounded-full bg-[#FFD60A] animate-pulse">AGORA</span>':''}</div>${s.sub?`<div class="text-[10px] text-zinc-400 tracking-wide mt-0.5">${s.sub}</div>`:''}<div class="text-[12px] text-zinc-600 mt-1 leading-[1.4]">${s.desc}</div>${curr?`<div class="mt-2 inline-flex items-center gap-2 text-[11px] px-3 py-1 rounded-full bg-black text-white"><span class="w-1.5 h-1.5 rounded-full bg-[#FFD60A] animate-pulse"></span>Atualizado agora • Shenzhen, Guangdong, China</div>`:''}</div>
</div>`;
}).join("")}
</div>
</div>
</div>

${o.fotos.length>0?`<div class="mt-8"><div class="text-[11px] font-black tracking-widest">FOTOS REAIS DO GALPÃO • QC (${o.fotos.length})</div><div class="mt-3 grid grid-cols-3 gap-3">${o.fotos.map(f=>`<div class="aspect-square rounded-[16px] overflow-hidden border bg-[#F6F5F1]"><img src="${f}" class="w-full h-full object-cover"></div>`).join("")}</div></div>`:`<div class="mt-8 border border-dashed rounded-[20px] p-8 text-center bg-[#FBFAF7]"><div class="font-bold text-[14px]">Fotos em produção</div><div class="text-[12px] text-zinc-500 mt-1">Nossa equipe no galpão Shenzhen vai subir as fotos reais em breve.</div></div>`}

</div>
</div>

<div class="mt-6 text-center text-[11px] tracking-[0.12em] text-zinc-400 uppercase">© 2026 Jaguarara Imports • Conectando o Brasil ao Mundo • Galpão Shenzhen, Guangdong, China</div>
</div>
</div>
`;
}

function logout(){sessionStorage.removeItem("jg_auth"); location.reload();}

(function(){
let track=isTrack();
if(track){ renderClient(track); return; }
if(sessionStorage.getItem("jg_auth")==="1"){ renderAdmin(); } else { renderLogin(); }
})();

window.logout=logout;
window.openNew=openNew;
window.closeNew=closeNew;
window.openDrawer=openDrawer;
window.closeDrawer=closeDrawer;
</script>
</body>
</html>
