function getCommission(v){if(v<=500)return 25;if(v<=1500)return 50;if(v<=3000)return 80;return 120;}
function formatBRL(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function formatWeight(val,unit){if(!val) return ''; return `${val}${unit||'kg'}`;}
function genId(){return 'JG-'+Math.floor(1000+Math.random()*9000);}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.remove('opacity-0','translate-y-4');
  t.classList.add('opacity-100','translate-y-0');
  setTimeout(()=>{t.classList.add('opacity-0','translate-y-4');t.classList.remove('opacity-100','translate-y-0');},3000);
}
function getTrackId(){
  const hash=location.hash||'';
  if(hash.includes('track=')) return hash.split('track=')[1].split('&')[0];
  const params=new URLSearchParams(location.search);
  if(params.get('track')) return params.get('track');
  return null;
}
function isAdminLogged(){return sessionStorage.getItem(ADMIN_SESSION_KEY)==='1';}

let orders=[], selectedId=null, showNew=false, showDel=null, showStatus=null;
let unsubscribeAdmin=null, unsubscribeClient=null;

async function loadOrdersLocal(){
  for(let k of OLD_KEYS){
    const rawOld=localStorage.getItem(k);
    if(rawOld){ try{ const p=JSON.parse(rawOld); if(Array.isArray(p)&&p.length){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } }catch(e){} }
  }
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const parsed=JSON.parse(raw);
      return Array.isArray(parsed)?parsed.map(o=>({
        ...o,
        id: o.id?.startsWith('BE-') ? o.id.replace('BE-','JG-') : o.id,
        pesoEst: typeof o.pesoEst==='object'?o.pesoEst:{value:o.pesoEst||'',unit:'kg'},
        pesoReal: typeof o.pesoReal==='object'?o.pesoReal:{value:o.pesoReal||'',unit:'kg'},
      })):[];
    }catch(e){return [];}
  }
  return [];
}
async function fetchOrders(){
  if(isFirebaseConfigured && db){
    try{
      const snap = await getDocs(collection(db, "pedidos"));
      const list=[]; snap.forEach(d=>{ const data=d.data(); data.id = data.id?.startsWith('BE-') ? data.id.replace('BE-','JG-') : data.id; list.push(data); });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return list;
    }catch(e){ return await loadOrdersLocal(); }
  }else{
    return await loadOrdersLocal();
  }
}
async function saveOrderToDB(order){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
  if(isFirebaseConfigured && db){
    try{ await setDoc(doc(db, "pedidos", order.id), order); }catch(e){}
  }
}
async function deleteOrderFromDB(id){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
  if(isFirebaseConfigured && db){
    try{ await deleteDoc(doc(db, "pedidos", id)); }catch(e){}
  }
}
async function updateOrderInDB(order){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
  if(isFirebaseConfigured && db){
    try{ await setDoc(doc(db, "pedidos", order.id), order, {merge:true}); }catch(e){}
  }
}

async function render(){
  const tid=getTrackId();
  const app=document.getElementById('app');
  if(tid){
    if(unsubscribeAdmin){unsubscribeAdmin(); unsubscribeAdmin=null;}
    if(isFirebaseConfigured && db){
      if(unsubscribeClient) unsubscribeClient();
      const docRef = doc(db, "pedidos", tid);
      try{
        const snap = await getDoc(docRef);
        if(snap.exists()){
          renderClient(snap.data(), app);
          unsubscribeClient = onSnapshot(docRef, (docSnap)=>{
            if(docSnap.exists()) renderClient(docSnap.data(), app);
          });
          return;
        }
      }catch(e){}
      const oLocal = orders.find(x=>x.id===tid);
      if(oLocal){ renderClient(oLocal,app); return; }
      app.innerHTML=`<div class="min-h-screen bg-[#081A12] flex items-center justify-center p-6"><div class="bg-white text-black p-8 rounded-[28px] max-w-md w-full text-center"><div class="text-4xl mb-4">🐆</div><h1 class="font-black text-lg">Pedido ${tid} não encontrado</h1><p class="text-gray-600 text-sm mt-3">Ainda não está no sistema Jaguarara.</p></div></div>`;
      return;
    }else{
      const o=orders.find(x=>x.id===tid);
      if(!o){ app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-6"><div class="bg-white text-black p-8 rounded-[28px]">Pedido não encontrado</div></div>`; return; }
      renderClient(o,app); return;
    }
  }
  if(!isAdminLogged()){ renderLogin(app); return; }
  if(!orders.length) orders = await fetchOrders();
  if(isFirebaseConfigured && db && !unsubscribeAdmin){
    try{
      unsubscribeAdmin = onSnapshot(collection(db, "pedidos"), (snap)=>{
        const list=[]; snap.forEach(d=>list.push(d.data()));
        orders=list; localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        if(!selectedId && !showNew && !showDel && !showStatus) renderAdmin(document.getElementById('app'));
      });
    }catch(e){}
  }
  renderAdmin(app);
}

    ${sel?`
    <div class="fixed inset-0 z-50 flex justify-end"><div class="absolute inset-0 bg-[#081A12]/60 backdrop-blur-sm" onclick="window.closeDet()"></div><div class="relative w-full max-w-[520px] bg-white h-full overflow-y-auto border-l border-black/10 p-6 shadow-2xl">

      <div class="bg-[#F6F7F2] rounded-2xl p-4 mb-6 border border-black/5">

          <div><div class="text-[10px] text-gray-500 uppercase font-black">PESO REAL</div><div class="flex gap-1 mt-1"><input id="prVal" type="number" value="${sel.pesoReal?.value||''}" class="bg-white border border-black/10 rounded-l-xl px-2 py-2.5 w-full text-sm"><select id="prUnit" class="bg-white border border-black/10 rounded-r-xl px-2 py-2.5 text-xs"><option value="kg" ${sel.pesoReal?.unit==='kg'?'selected':''}>kg</option><option value="g" ${sel.pesoReal?.unit==='g'?'selected':''}>g</option></select></div></div>

        </div>
        <button onclick="window.saveExtra('${sel.id}')" class="mt-4 w-full bg-[#081A12] text-[#FFDF00] font-black py-3 rounded-full text-xs">💾 Salvar - Atualiza cliente ao vivo</button>
      </div>
      <div class="mb-4"><label class="text-[11px] font-black text-gray-500">STATUS - JAGUARARA</label><select id="selSt" class="mt-1 w-full bg-[#F6F7F2] border border-black/10 rounded-xl px-4 py-3 text-sm">${STATUSES.map(s=>`<option value="${s.id}" ${s.id===sel.status?'selected':''}>${s.id}. ${s.label}</option>`).join('')}</select><button onclick="window.askSt('${sel.id}')" class="mt-2 w-full bg-[#FFDF00] text-black font-black py-3 rounded-full text-sm">Atualizar Status 🐆</button></div>
      <div class="mb-4"><label class="text-[11px] font-black text-gray-500">FOTOS QC</label><div class="grid grid-cols-3 gap-2 mt-2">${sel.fotos.map((f,i)=>`<div class="relative"><img src="${f}" class="w-full h-20 object-cover rounded-xl"><button onclick="window.remFoto('${sel.id}',${i})" class="absolute -top-1 -right-1 bg-red-500 text-white w-5 h-5 rounded-full text-[10px]">✕</button></div>`).join('')}</div><input type="file" id="fInput" multiple accept="image/*" class="mt-3 text-xs w-full"><button onclick="window.upFoto('${sel.id}')" class="mt-2 w-full bg-black/5 py-2 rounded-full text-xs font-bold">Adicionar Fotos QC 📸</button></div>
      <div class="flex gap-2"><button onclick="window.copyLink('${sel.id}')" class="flex-1 bg-[#009739] text-white font-black py-3 rounded-full text-xs">🔗 Link Cliente Brasil</button><button onclick="window.openPrev('${sel.id}')" class="flex-1 bg-[#081A12] text-[#FFDF00] font-black py-3 rounded-full text-xs">👁️ Ver como cliente</button></div>
      <div class="mt-6 p-4 bg-[#009739]/5 border border-[#009739]/10 rounded-2xl"><div class="text-[10px] font-black text-[#009739] tracking-widest">MENSAGEM WHATSAPP</div><div class="flex gap-2 mt-2"><button onclick="window.gen('${sel.id}','link')" class="flex-1 bg-white border border-black/10 py-2 rounded-full text-xs font-bold">Link Rastreio</button><button onclick="window.gen('${sel.id}','galpao')" class="flex-1 bg-white border border-black/10 py-2 rounded-full text-xs font-bold">Chegou Galpão</button></div><textarea id="msgOut" class="w-full mt-2 h-24 bg-white border border-black/10 rounded-xl p-3 text-xs"></textarea><button onclick="window.copyMsg()" class="w-full mt-2 bg-[#25D366] text-white font-black py-2.5 rounded-full text-xs">📤 Copiar e abrir WhatsApp</button></div>
    </div></div>`:''}

    ${showNew?`<div class="fixed inset-0 z-[60] flex items-center justify-center p-4"><div class="absolute inset-0 bg-[#081A12]/70 backdrop-blur-sm" onclick="window.closeNew()"></div><div class="relative bg-white rounded-[28px] p-7 w-full max-w-md shadow-2xl border border-black/5"><div class="h-1.5 w-full bg-brazil-gradient rounded-full mb-4"></div><h2 class="font-black text-lg text-[#081A12]">+ Novo Pedido Jaguarara 🐆</h2><p class="text-[11px] text-gray-500 mb-4">100% Brasileiro • Conectando o Brasil ao Mundo</p><div class="space-y-3"><input id="nc" type="text" placeholder="Nome Cliente*" class="w-full bg-[#F6F7F2] border border-black/5 rounded-xl px-4 py-3 text-sm text-black"><input id="nw" type="tel" placeholder="WhatsApp*" class="w-full bg-[#F6F7F2] border border-black/5 rounded-xl px-4 py-3 text-sm text-black"><input id="nl" type="text" placeholder="Link produto China" class="w-full bg-[#F6F7F2] border border-black/5 rounded-xl px-4 py-3 text-sm text-black"><div><label class="text-[10px] font-black text-gray-500">VALOR PRODUTO</label><div class="flex mt-1"><span class="bg-[#F6F7F2] border border-black/10 px-3 py-3 rounded-l-xl text-xs font-bold">R$</span><input id="nv" type="number" step="0.01" placeholder="890,00" class="w-full bg-[#F6F7F2] border border-black/10 rounded-r-xl px-4 py-3 text-sm text-black"></div></div><div class="grid grid-cols-2 gap-2"><div><label class="text-[10px] font-black text-gray-500">PESO EST.</label><input id="npVal" type="number" placeholder="200" class="w-full bg-[#F6F7F2] border border-black/5 rounded-xl px-3 py-3 text-sm mt-1 text-black"></div><div><label class="text-[10px] font-black text-gray-500">UNIDADE</label><select id="npUnit" class="w-full bg-[#F6F7F2] border border-black/5 rounded-xl px-3 py-3 text-sm mt-1 text-black"><option value="kg">kg</option><option value="g" selected>g</option></select></div></div><div id="cp" class="text-xs text-[#009739] bg-[#009739]/10 p-3 rounded-xl font-bold">Digite valor</div></div><div class="flex gap-2 mt-6"><button onclick="window.closeNew()" class="flex-1 bg-black/5 py-3 rounded-full font-bold">Cancelar</button><button onclick="window.createOrd()" class="flex-1 bg-[#009739] text-white font-black py-3 rounded-full">Criar Pedido 🐆</button></div></div></div>`:''}
    ${showDel?`<div class="fixed inset-0 z-[70] flex items-center justify-center p-4"><div class="absolute inset-0 bg-[#081A12]/70" onclick="window.cancelDel()"></div><div class="relative bg-white rounded-[24px] p-6 w-full max-w-sm text-center text-black"><h3 class="font-black mb-2">Apagar ${showDel}?</h3><p class="text-xs text-gray-500">Essa ação não volta</p><div class="flex gap-2 mt-6"><button onclick="window.cancelDel()" class="flex-1 bg-black/5 py-3 rounded-full font-bold">Cancelar</button><button onclick="window.delOrd('${showDel}')" class="flex-1 bg-red-500 text-white font-black py-3 rounded-full">Apagar</button></div></div></div>`:''}
    ${showStatus?`<div class="fixed inset-0 z-[70] flex items-center justify-center p-4"><div class="absolute inset-0 bg-[#081A12]/70" onclick="window.cancelSt()"></div><div class="relative bg-white rounded-[24px] p-6 w-full max-w-sm text-center text-black"><h3 class="font-black mb-2">Confirmar avanço?</h3><p class="text-sm text-gray-600 mb-2">De <b>${STATUSES.find(s=>s.id===orders.find(o=>o.id===showStatus.id)?.status)?.label}</b> para <b>${STATUSES.find(s=>s.id===showStatus.ns)?.label}</b></p><div class="flex gap-2 mt-6"><button onclick="window.cancelSt()" class="flex-1 bg-black/5 py-3 rounded-full font-bold">Cancelar</button><button onclick="window.applySt()" class="flex-1 bg-[#FFDF00] text-black font-black py-3 rounded-full">Confirmar 🐆</button></div></div></div>`:''}
  </div>`;
  const nv=document.getElementById('nv');
  if(nv)nv.addEventListener('input',e=>{const v=parseFloat(e.target.value)||0;const c=getCommission(v);document.getElementById('cp').innerHTML=v>0?`Valor ${formatBRL(v)} + Comissão <b>${formatBRL(c)}</b> = <b class=text-[#081A12]>${formatBRL(v+c)}</b>`:'Digite valor';});
}

function filtered(){const q=(document.getElementById('search')?.value||'').toLowerCase();if(!q)return orders.slice().reverse();return orders.filter(o=>o.cliente.toLowerCase().includes(q)||o.id.toLowerCase().includes(q)).reverse();}

window.selOrder=(id)=>{selectedId=id;render();};
window.closeDet=()=>{selectedId=null;render();};
window.openNew=()=>{showNew=true;render();};
window.closeNew=()=>{showNew=false;render();};
window.login=()=>{
  const p=document.getElementById('loginPass').value;
  if(p===FIXED_PASSWORD){
    sessionStorage.setItem(ADMIN_SESSION_KEY,'1');
    showToast('✅ Bem-vindo, Jaguar! Senha correta 🐆🇧🇷');
    render();
  }else{
    showToast('❌ Senha incorreta');
    const el=document.getElementById('loginPass');
    if(el){el.classList.add('border-red-500','animate-[shake_0.5s]'); setTimeout(()=>el.classList.remove('border-red-500'),1000);}
  }
};
window.logout=()=>{sessionStorage.removeItem(ADMIN_SESSION_KEY);if(unsubscribeAdmin){unsubscribeAdmin();unsubscribeAdmin=null;}render();showToast('Saiu da selva 🍃');};
window.createOrd=async()=>{
  const c=document.getElementById('nc').value.trim();
  const w=document.getElementById('nw').value.trim().replace(/\D/g,'');
  const l=document.getElementById('nl').value.trim();
  const v=parseFloat(document.getElementById('nv').value);
  const pv=document.getElementById('npVal').value.trim();
  const pu=document.getElementById('npUnit').value;
  if(!c||!w||!v){showToast('Preencha nome, whats e valor');return;}
  const id=genId();const now=new Date().toLocaleString('pt-BR');
  const newOrder={id,cliente:c,whatsapp:w,link:l,valor:v,pesoEst:{value:pv,unit:pu},status:1,pesoReal:{value:'',unit:'kg'},frete:'',rastreio:'',fotos:[],datas:{1:now}};
  orders.push(newOrder); await saveOrderToDB(newOrder);
  showNew=false;selectedId=id;render();showToast('✅ Pedido '+id+' criado!');setTimeout(()=>window.copyLink(id),500);
};
window.askDel=(id)=>{showDel=id;render();};
window.cancelDel=()=>{showDel=null;render();};
window.delOrd=async(id)=>{orders=orders.filter(o=>o.id!==id); await deleteOrderFromDB(id); showDel=null;if(selectedId===id)selectedId=null;render();showToast('Apagado');};
window.askSt=(id)=>{const ns=parseInt(document.getElementById('selSt').value);const cur=orders.find(o=>o.id===id).status;if(ns===cur){showToast('Já está nesse status');return;}showStatus={id,ns};render();};
window.cancelSt=()=>{showStatus=null;render();};
window.applySt=async()=>{const {id,ns}=showStatus;const o=orders.find(o=>o.id===id);o.status=ns;o.datas[ns]=new Date().toLocaleString('pt-BR');await updateOrderInDB(o);showStatus=null;render();showToast('✅ Status atualizado! Cliente vê ao vivo 🇧🇷');};
window.saveExtra=async(id)=>{const o=orders.find(o=>o.id===id);o.valor=parseFloat(document.getElementById('valorProd').value)||o.valor;o.pesoReal={value:document.getElementById('prVal').value,unit:document.getElementById('prUnit').value};o.frete=document.getElementById('fr').value;o.rastreio=document.getElementById('rt').value;await updateOrderInDB(o);render();showToast('💾 Salvo!');};
window.upFoto=(id)=>{const inp=document.getElementById('fInput');const o=orders.find(o=>o.id===id);if(!inp.files.length){showToast('Selecione fotos');return;}Array.from(inp.files).forEach(f=>{const r=new FileReader();r.onload=async(e)=>{o.fotos.push(e.target.result);await updateOrderInDB(o);render();showToast('📸 Foto QC adicionada!');};r.readAsDataURL(f);});};
window.remFoto=async(id,i)=>{const o=orders.find(o=>o.id===id);o.fotos.splice(i,1);await updateOrderInDB(o);render();showToast('Foto removida');};
window.copyLink=(id)=>{const base=location.href.split('#')[0].split('?')[0];const url=base+'#track='+id;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>showToast('🔗 Link Jaguarara copiado!')).catch(()=>{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('🔗 Copiado!');});}else{prompt('Copie:',url);}};
window.openPrev=(id)=>{location.hash='track='+id;render();};
window.gen=(id,type)=>{const o=orders.find(o=>o.id===id);const base=location.href.split('#')[0].split('?')[0];const link=base+'#track='+id;const com=getCommission(o.valor);const total=o.frete?formatBRL(o.valor+com+parseFloat(o.frete)):'a definir';const nome=o.cliente.split(' ')[0];const pesoStr=o.pesoReal&&o.pesoReal.value?formatWeight(o.pesoReal.value,o.pesoReal.unit):'a definir';let msg='';if(type==='link')msg=`Fala ${nome}! 🐆🇧🇷 Jaguarara Imports\n\nSeu pedido ${o.id} está no sistema! Acompanhamento 100% brasileiro e ao vivo:\n\n🔗 ${link}\n\nPeso, frete, fotos QC e status com atualizações em tempo real ✨\n\nConectando o Brasil ao Mundo 🌎`;else if(type==='galpao')msg=`Chegou no galpão! 📦🐆 ${nome}, seu pedido ${o.id} chegou no nosso centro.\n\n⚖️ Peso real: ${pesoStr}\n💰 Frete: ${o.frete?formatBRL(o.frete):'a definir'}\n💵 Total: ${total}\n\nAcompanhe com rastreio brasileiro:\n${link}`;document.getElementById('msgOut').value=msg;};
window.copyMsg=()=>{const t=document.getElementById('msgOut');if(!t.value){showToast('Gere mensagem');return;}navigator.clipboard.writeText(t.value).then(()=>showToast('Copiado!')).catch(()=>{});const o=orders.find(x=>x.id===selectedId);if(o) window.open(`https://wa.me/${o.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(t.value)}`,'_blank');};
window.render=render;
window.filtered=filtered;
window.addEventListener('hashchange',render);
